name: Component Repo PipelineRun Reconciliation

on:
  workflow_dispatch:
    inputs:
      release:
        description: Component release branch
        type: choice
        required: true
        options:
          - rhoai-2.25
          - rhoai-3.4
          - rhoai-3.5
          - rhoai-3.6
          - rhoai-3.7-ea.1
      repository:
        description: Managed repository name, or all (start with one repository)
        type: string
        required: true
        default: ai-gateway-controller
      template_set:
        description: >-
          Reviewed flat component template set under tekton-templates
        type: string
        required: true
      tracking_issue:
        description: Optional Jira issue key for generated PRs
        type: string
        required: false
      dry_run:
        description: Preview only; no publication credentials or PRs
        type: boolean
        default: true
        required: true
      allow_batch_publication:
        description: >-
          Confirm publishing all repositories, which can trigger CI builds
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: policy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}
          path: release
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
      - name: Select repositories from the release inventory
        id: matrix
        env:
          RELEASE: ${{ inputs.release }}
          REPOSITORY: ${{ inputs.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_BATCH_PUBLICATION: ${{ inputs.allow_batch_publication }}
        run: |
          matrix=$(uv run \
            policy/script/reconcile_component_repo_pipelineruns.py matrix \
            --source release --release "$RELEASE" --repository "$REPOSITORY" \
            --dry-run "$DRY_RUN" \
            --allow-batch-publication "$ALLOW_BATCH_PUBLICATION")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  reconcile:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    concurrency:
      group: plr-enforce-${{ inputs.release }}-${{ matrix.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: policy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: red-hat-data-services/devops-shared-resources
          ref: main
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: red-hat-data-services/${{ matrix.repository }}
          ref: ${{ inputs.release }}
          path: target
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
      - name: Prepare and verify component repo reconciliation
        id: prepare
        env:
          RELEASE: ${{ inputs.release }}
          REPOSITORY: ${{ matrix.repository }}
          INVENTORY_REVISION: ${{ matrix.inventory_revision }}
          TEMPLATE_SET: ${{ inputs.template_set }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
        run: |
          uv run \
            policy/script/reconcile_component_repo_pipelineruns.py prepare \
            --target target --tooling tooling \
            --policy-root policy/tekton-templates \
            --template-set "$TEMPLATE_SET" \
            --release "$RELEASE" --repository "$REPOSITORY" \
            --inventory-revision "$INVENTORY_REVISION" \
            --tracking-issue "$TRACKING_ISSUE" \
            --report "$RUNNER_TEMP/enforcement-report"
      - name: Checkout independently trusted publisher
        if: ${{ !inputs.dry_run && steps.prepare.outputs.status == 'ready' }}
        uses: actions/checkout@v4
        with:
          repository: red-hat-data-services/devops-shared-resources
          ref: b8fe79fa5784260b32712bd6730d162d132852c8
          path: publisher
          persist-credentials: false
      - name: Obtain narrowly scoped publication token
        if: ${{ !inputs.dry_run && steps.prepare.outputs.status == 'ready' }}
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: red-hat-data-services
          repositories: ${{ matrix.repository }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout the exact preview base for publication
        if: ${{ !inputs.dry_run && steps.prepare.outputs.status == 'ready' }}
        uses: actions/checkout@v4
        with:
          repository: red-hat-data-services/${{ matrix.repository }}
          ref: ${{ steps.prepare.outputs.base }}
          token: ${{ steps.app-token.outputs.token }}
          path: publish-target
      - name: Publish verified component repo reconciliation PR
        if: ${{ !inputs.dry_run && steps.prepare.outputs.status == 'ready' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          uv run \
            policy/script/reconcile_component_repo_pipelineruns.py publish \
            --target publish-target --publisher-root publisher \
            --report "$RUNNER_TEMP/enforcement-report"
      - name: Upload inventory, patch, and reports (not checkout contents)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            plr-enforce-${{ inputs.release }}-${{ matrix.repository }}
          path: |
            ${{ runner.temp }}/enforcement-report/*.json
            ${{ runner.temp }}/enforcement-report/*.log
            ${{ runner.temp }}/enforcement-report/*.patch
          if-no-files-found: ignore
