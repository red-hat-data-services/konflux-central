name: Generate Architecture Report

on:
  push:
    branches:
      - 'rhoai-*'
    paths:
      - 'pipelineruns/**'
      - 'pipelines/**'
      - 'script/multi-arch-tracking/exceptions.toml'

  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch to generate report for (e.g. rhoai-3.5)'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main (for script)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and create local target branch
        run: |
          target="${{ steps.branch.outputs.name }}"
          git fetch origin "${target}"
          git branch "${target}" "origin/${target}" 2>/dev/null || true

      - name: Check for architecture-related changes
        id: check
        if: github.event_name == 'push'
        run: |
          target="${{ steps.branch.outputs.name }}"
          diff=$(git diff "${target}~1".."${target}" --unified=0 -- 'pipelineruns/**' 'pipelines/**' 'script/multi-arch-tracking/exceptions.toml' || true)
          if echo "$diff" | grep -qiE 'build-platforms|amd64|arm64|x86_64|ppc64le|s390x|multi-arch|architecture'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No architecture-related changes detected, skipping report generation."
          fi

      - name: Set up Python
        if: steps.check.outcome == 'skipped' || steps.check.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.check.outcome == 'skipped' || steps.check.outputs.relevant == 'true'
        run: pip install pyyaml toml

      - name: Generate report
        if: steps.check.outcome == 'skipped' || steps.check.outputs.relevant == 'true'
        run: |
          python3 script/multi-arch-tracking/generate-table.py \
            --format yaml \
            --branch "${{ steps.branch.outputs.name }}" \
            --output /tmp/multi-arch-report.yaml

      - name: Commit report to target branch
        if: steps.check.outcome == 'skipped' || steps.check.outputs.relevant == 'true'
        run: |
          target="${{ steps.branch.outputs.name }}"
          git switch "${target}"
          cp /tmp/multi-arch-report.yaml multi-arch-report.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add multi-arch-report.yaml
          if git diff --cached --quiet; then
            echo "No changes to multi-arch-report.yaml"
          else
            git commit -m "chore: regenerate architecture report [skip ci]"
            git push origin "${target}"
          fi
