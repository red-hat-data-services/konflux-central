name: Maintain release PR pipelines
on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Target release branch (rhoai-x.y[-ea.z])'
        required: true
        type: string
      repository:
        description: 'Optional pipelineruns repository directory; empty means all'
        default: ''
        type: string
      dry_run:
        description: 'Generate reports only; no commit, push, or PR'
        default: true
        type: boolean
      tooling_ref:
        description: 'Shared-resources ref with validate-tekton generated-child support'
        default: main
        type: string
permissions:
  contents: read
concurrency:
  group: release-pr-maintenance-${{ inputs.release_branch }}
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout policy and orchestration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Checkout shared tooling
        uses: actions/checkout@v4
        with:
          repository: red-hat-data-services/devops-shared-resources
          ref: ${{ inputs.tooling_ref }}
          path: tooling
          persist-credentials: false
      - name: Generate publication token
        if: ${{ !inputs.dry_run }}
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_branch }}
          path: target
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: ${{ !inputs.dry_run }}
      - uses: astral-sh/setup-uv@v4
      - name: Generate, validate, and report
        shell: bash
        env:
          RELEASE: ${{ inputs.release_branch }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-pr-report"
          uv run --no-project python source/script/maintain_release_pr.py \
            --target target --tooling tooling --config-dir source/tekton-templates/release-pr \
            --branch "$RELEASE" --repository "$REPOSITORY" \
            --report-dir "$RUNNER_TEMP/release-pr-report" \
            2>&1 | tee "$RUNNER_TEMP/release-pr-report/run.log"
      - name: Publish a release maintenance PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE: ${{ inputs.release_branch }}
        run: |
          uv run --no-project python source/script/maintain_release_pr.py \
            --target target --tooling tooling --config-dir source/tekton-templates/release-pr \
            --branch "$RELEASE" --report-dir "$RUNNER_TEMP/release-pr-report" --publish
      - name: Upload reports and diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-pr-maintenance-report
          path: ${{ runner.temp }}/release-pr-report
          if-no-files-found: ignore
