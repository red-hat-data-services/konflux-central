name: PipelineRun template alignment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview only, or apply safe fixes and open/update release PRs
        type: choice
        required: true
        default: preview
        options:
          - preview
          - create-prs

permissions:
  contents: read

env:
  # Trusted publisher code selection, independent of the floating validator.
  PUBLISHER_REVISION: b8fe79fa5784260b32712bd6730d162d132852c8

concurrency:
  group: pipelinerun-conformance
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy: &release-strategy
      fail-fast: false
      matrix:
        branch:
          - rhoai-2.25
          - rhoai-3.4
          - rhoai-3.5
          - rhoai-3.6
          - rhoai-3.7-ea.1
    steps:
      - name: Checkout runner and templates from this workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Checkout branch to inspect without publishing credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: target
          persist-credentials: false

      - name: Checkout shared validator from main
        uses: actions/checkout@v4
        with:
          repository: red-hat-data-services/devops-shared-resources
          ref: main
          path: validator
          persist-credentials: false

      - name: Checkout reviewed shared publisher for adapter tests
        uses: actions/checkout@v4
        with:
          repository: red-hat-data-services/devops-shared-resources
          ref: ${{ env.PUBLISHER_REVISION }}
          path: publisher
          persist-credentials: false

      - name: Set up uv without cross-job dependency caches
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Test standalone logic
        env:
          VALIDATOR_CHECKOUT: ${{ github.workspace }}/validator
          PUBLISHER_CHECKOUT: ${{ github.workspace }}/publisher
        shell: bash
        run: |
          set -o pipefail
          uv run --project validator --extra dev --frozen python -m pytest \
            source/script/test_reconcile_pipelineruns.py source/script/test_publish_conformance_pr.py \
            source/script/test_conformance_artifact.py -q \
            2>&1 | tee "$RUNNER_TEMP/conformance-tests.log"

      - name: Generate report and patch preview
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
        shell: bash
        run: |
          set -o pipefail
          uv run --project validator --frozen python source/script/reconcile_pipelineruns.py \
            --path target --validator validator --branch "$TARGET_BRANCH" \
            --config-dir source/tekton-templates/pipelineruns \
            --report-dir "$RUNNER_TEMP/conformance" \
            2>&1 | tee "$RUNNER_TEMP/conformance.log"

      - name: Apply fixes to disposable checkout (PR mode only)
        if: inputs.mode == 'create-prs'
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
        shell: bash
        run: |
          set -o pipefail
          uv run --project validator --frozen python source/script/reconcile_pipelineruns.py \
            --path target --validator validator --branch "$TARGET_BRANCH" \
            --config-dir source/tekton-templates/pipelineruns --fix \
            --report-dir "$RUNNER_TEMP/conformance/applied" \
            2>&1 | tee "$RUNNER_TEMP/conformance-apply.log"

      - name: Re-read and revalidate fixed files (PR mode only)
        if: inputs.mode == 'create-prs'
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
        shell: bash
        run: |
          set -o pipefail
          uv run --project validator --frozen python source/script/reconcile_pipelineruns.py \
            --path target --validator validator --branch "$TARGET_BRANCH" \
            --config-dir source/tekton-templates/pipelineruns \
            --report-dir "$RUNNER_TEMP/conformance/recheck" \
            2>&1 | tee "$RUNNER_TEMP/conformance-recheck.log"

      - name: Export data-only publication artifact
        if: inputs.mode == 'create-prs'
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          uv run --project validator --frozen python source/script/conformance_artifact.py export \
            --path target --bundle "$RUNNER_TEMP/publication" --branch "$TARGET_BRANCH" \
            --source-sha "$SOURCE_SHA" --publisher-revision "$PUBLISHER_REVISION" \
            --plan "$RUNNER_TEMP/conformance/applied/report.json" \
            --recheck "$RUNNER_TEMP/conformance/recheck/report.json"

      - name: Upload publication artifact
        if: inputs.mode == 'create-prs'
        uses: actions/upload-artifact@v4
        with:
          name: pipelinerun-plan-${{ matrix.branch }}
          path: ${{ runner.temp }}/publication/
          include-hidden-files: true # The bounded payload contains .tekton/ YAML only.
          if-no-files-found: error

      - name: Upload reports, patches, and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipelinerun-conformance-${{ matrix.branch }}
          path: |
            ${{ runner.temp }}/conformance/
            ${{ runner.temp }}/conformance*.log
          if-no-files-found: warn

  publish:
    needs: plan
    if: github.ref == 'refs/heads/main' && inputs.mode == 'create-prs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy: *release-strategy
    steps:
      - name: Checkout trusted publisher from this workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Checkout current release tip without publishing credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: target
          persist-credentials: false

      - name: Download data-only plan from this run
        uses: actions/download-artifact@v4
        with:
          name: pipelinerun-plan-${{ matrix.branch }}
          path: ${{ runner.temp }}/publication

      - name: Checkout reviewed publisher independently of planner data
        uses: actions/checkout@v4
        with:
          repository: red-hat-data-services/devops-shared-resources
          ref: ${{ env.PUBLISHER_REVISION }}
          path: publisher
          persist-credentials: false

      - name: Set up uv without planner caches
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Prepare trusted parser environment before obtaining any App token
        shell: bash
        run: |
          uv --no-config venv "$RUNNER_TEMP/publisher-venv"
          uv --no-config pip install --python "$RUNNER_TEMP/publisher-venv/bin/python" \
            --only-binary :all: "ruamel.yaml==0.19.1"

      - name: Independently validate artifacts before obtaining any App token
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -o pipefail
          "$RUNNER_TEMP/publisher-venv/bin/python" source/script/publish_conformance_pr.py \
            --path target --repository "$GITHUB_REPOSITORY" --base "$TARGET_BRANCH" \
            --source-sha "$SOURCE_SHA" --artifact "$RUNNER_TEMP/publication" --publisher publisher \
            2>&1 | tee "$RUNNER_TEMP/conformance-verify.log"

      - name: Generate publishing token after artifact validation
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish with trusted central code only
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_BRANCH: ${{ matrix.branch }}
          SOURCE_SHA: ${{ github.sha }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/publisher.gitconfig
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -o pipefail
          gh auth setup-git --hostname github.com
          "$RUNNER_TEMP/publisher-venv/bin/python" source/script/publish_conformance_pr.py \
            --path target --repository "$GITHUB_REPOSITORY" --base "$TARGET_BRANCH" \
            --source-sha "$SOURCE_SHA" --artifact "$RUNNER_TEMP/publication" \
            --publisher publisher --publish \
            2>&1 | tee "$RUNNER_TEMP/conformance-publish.log"

      - name: Upload publisher log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipelinerun-publish-${{ matrix.branch }}
          path: |
            ${{ runner.temp }}/conformance-publish.log
            ${{ runner.temp }}/conformance-verify.log
          if-no-files-found: ignore
