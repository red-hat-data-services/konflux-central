name: PipelineRun template alignment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview only, or publish validated release PRs
        type: choice
        required: true
        default: preview
        options:
          - preview
          - create-prs

permissions:
  contents: read

env:
  PUBLISHER_REVISION: 4de549ff57e1e373424aee0ea21c4b997731e7f0

concurrency:
  group: pipelinerun-conformance
  cancel-in-progress: false

jobs:
  align:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch:
          - rhoai-2.25
          - rhoai-3.4
          - rhoai-3.5
          - rhoai-3.6
          - rhoai-3.7-ea.1
    steps:
      - name: Checkout trusted runner and templates
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Checkout release base without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: target
          persist-credentials: false

      - name: Checkout reviewed corrected validator, worker and publisher
        uses: actions/checkout@v4
        with:
          repository: red-hat-data-services/devops-shared-resources
          ref: ${{ env.PUBLISHER_REVISION }}
          path: publisher
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Test standalone logic
        env:
          VALIDATOR_CHECKOUT: ${{ github.workspace }}/publisher
          PUBLISHER_CHECKOUT: ${{ github.workspace }}/publisher
        shell: bash
        run: |
          set -o pipefail
          uv run --project publisher --extra dev --frozen python -m pytest \
            source/script/test_reconcile_pipelineruns.py source/script/test_publish_conformance_pr.py \
            source/script/test_conformance_artifact.py -q \
            2>&1 | tee "$RUNNER_TEMP/conformance-tests.log"

      - name: Plan using shared isolated phases
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -o pipefail
          uv run --project publisher --frozen python source/script/reconcile_pipelineruns.py \
            --path target --validator publisher --publisher publisher --source-sha "$SOURCE_SHA" \
            --branch "$TARGET_BRANCH" --config-dir source/tekton-templates/pipelineruns \
            --report-dir "$RUNNER_TEMP/conformance" \
            2>&1 | tee "$RUNNER_TEMP/conformance.log"

      - name: Replay and verify trusted plan before requesting a publishing token
        if: inputs.mode == 'create-prs'
        id: verify
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -o pipefail
          uv run --project publisher --no-sync --offline python source/script/publish_conformance_pr.py \
            --path target --repository "$GITHUB_REPOSITORY" --base "$TARGET_BRANCH" \
            --source-sha "$SOURCE_SHA" --artifact "$RUNNER_TEMP/conformance/bundle" \
            --publisher publisher --github-output "$GITHUB_OUTPUT" \
            2>&1 | tee "$RUNNER_TEMP/conformance-verify.log"

      - name: Generate scoped publishing token for verified nonempty changes
        if: inputs.mode == 'create-prs' && steps.verify.outputs.ready_to_publish == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish exact trusted plan
        if: inputs.mode == 'create-prs' && steps.verify.outputs.ready_to_publish == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_BRANCH: ${{ matrix.branch }}
          SOURCE_SHA: ${{ github.sha }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/publisher.gitconfig
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -o pipefail
          gh auth setup-git --hostname github.com
          uv run --project publisher --no-sync --offline python source/script/publish_conformance_pr.py \
            --path target --repository "$GITHUB_REPOSITORY" --base "$TARGET_BRANCH" \
            --source-sha "$SOURCE_SHA" --artifact "$RUNNER_TEMP/conformance/bundle" \
            --publisher publisher --publish \
            2>&1 | tee "$RUNNER_TEMP/conformance-publish.log"

      - name: Upload reports, diagnostic patch and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipelinerun-conformance-${{ matrix.branch }}
          path: |
            ${{ runner.temp }}/conformance/*.json
            ${{ runner.temp }}/conformance/*.patch
            ${{ runner.temp }}/conformance/phases/*.json
            ${{ runner.temp }}/conformance/bundle/*.json
            ${{ runner.temp }}/conformance*.log
          if-no-files-found: warn
