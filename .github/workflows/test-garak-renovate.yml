name: Test Garak Renovate Policy

on:
  pull_request:
    branches: [main]
    paths:
      - config.yaml
      - renovate/garak-renovate.json
      - pipelineruns/llama-stack-provider-trustyai-garak/**
      - script/test_garak_renovate_config.py
      - .github/workflows/sync-renovate-configs.yml
      - .github/workflows/test-garak-renovate.yml
  push:
    branches: [main]
    paths:
      - config.yaml
      - renovate/garak-renovate.json
      - pipelineruns/llama-stack-provider-trustyai-garak/**
      - script/test_garak_renovate_config.py
      - .github/workflows/sync-renovate-configs.yml
      - .github/workflows/test-garak-renovate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Garak Policy Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install PyYAML

      - name: Test the policy and pipeline mapping
        run: python -m unittest discover -s script -p 'test_garak_renovate_config.py' -v
