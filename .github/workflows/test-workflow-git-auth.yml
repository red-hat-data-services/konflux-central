name: Test Workflow Git Authentication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-z-stream-changes.yml'
      - '.github/workflows/generate-arch-report.yml'
      - '.github/workflows/retrigger-builds.yml'
      - '.github/workflows/pipelinerun-replicator.yml'
      - '.github/workflows/test-workflow-git-auth.yml'
      - 'script/test_workflow_git_auth.py'
      - 'script/conftest.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Lint workflows
        # Exclude existing shellcheck warnings in retrigger's display/listing code.
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            -ignore 'SC2010:|SC2012:|SC2129:' \
            .github/workflows/apply-z-stream-changes.yml \
            .github/workflows/generate-arch-report.yml \
            .github/workflows/retrigger-builds.yml \
            .github/workflows/pipelinerun-replicator.yml \
            .github/workflows/test-workflow-git-auth.yml
      - name: Check App-token checkout wiring
        run: uv run --with pytest --with pyyaml pytest script/test_workflow_git_auth.py -v
