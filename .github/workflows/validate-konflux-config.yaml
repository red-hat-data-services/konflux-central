name: Validate Konflux Config

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'rhoai-*'

jobs:
  validate:
    # Skip automated PRs from bots and Konflux automation
    if: >-
      github.actor != 'renovate[bot]'
      && !startsWith(github.head_ref, 'konflux/')
    runs-on:
      - konflux
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    steps:
      - name: Install git
        run: dnf install -y git

      - name: Run Konflux Config Validator
        uses: red-hat-data-services/rhods-devops-infra/.github/actions/konflux-config-validator@main
        with:
          RHOAI_VERSION: ${{ github.base_ref }}
          audit: 'true'
          OVERRIDE_DATASOURCE: konflux-central
          OVERRIDE_REF: ${{ github.event.pull_request.head.sha }}
