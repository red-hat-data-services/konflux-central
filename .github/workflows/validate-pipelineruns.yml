# Validates all PipelineRun YAML files on pull requests.
# See docs/validate-pipelineruns.md for check details and security model.
name: Validate PipelineRuns

on:
  pull_request:
    branches:
      - 'main'
      - 'rhoai-*'
    paths:
      - 'pipelineruns/**'
      - 'pipelines/**'
      - 'tekton-templates/all-pipelineruns/**'
      - 'tekton-templates/main-pr/**'
      - 'script/test_validate_pipelineruns.py'
      - 'script/conftest.py'
      - 'script/assemble_validation_comment.py'
      - 'script/test_assemble_validation_comment.py'
      - '.github/workflows/validate-pipelineruns.yml'

  workflow_dispatch:
    inputs:
      branch:
        type: string
        description: 'Release branch to validate against (e.g. rhoai-3.4). Leave empty for main.'
        required: false
        default: ''

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TARGET_BRANCH: ${{ github.base_ref || inputs.branch || 'main' }}
    steps:
      - name: Checkout PipelineRuns and parent branch history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout templates
        uses: actions/checkout@v4
        with:
          # Test proposed templates on main PRs; release branches use main's tooling.
          ref: ${{ env.TARGET_BRANCH == 'main' && github.sha || 'main' }}
          path: source
          persist-credentials: false

      - name: Record template sources for comment links
        shell: bash
        run: |
          git -C source rev-parse HEAD > "$RUNNER_TEMP/template-source-sha.txt"
          git -C source ls-tree -r --name-only HEAD -- \
            tekton-templates/all-pipelineruns tekton-templates/main-pr \
            > "$RUNNER_TEMP/template-files.txt"

      - name: Checkout shared validator
        uses: actions/checkout@v4
        with:
          repository: red-hat-data-services/devops-shared-resources
          ref: validate-tekton-dev
          path: validator
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Validate all PipelineRun conventions (no autofix)
        shell: bash
        run: |
          set -o pipefail
          uv run validator/scripts/validate-tekton \
            --config-dir source/tekton-templates/all-pipelineruns \
            --path target --branch "$TARGET_BRANCH" --no-checkout --json \
            > "$RUNNER_TEMP/validate-all-pipelineruns.json" \
            2> >(tee "$RUNNER_TEMP/validate-all-pipelineruns.log" >&2)

      - name: Validate main PR templates (no autofix)
        if: ${{ !cancelled() && env.TARGET_BRANCH == 'main' }}
        shell: bash
        run: |
          set -o pipefail
          uv run validator/scripts/validate-tekton \
            --config-dir source/tekton-templates/main-pr \
            --path target --branch "$TARGET_BRANCH" --no-checkout --json \
            > "$RUNNER_TEMP/validate-main-pr.json" \
            2> >(tee "$RUNNER_TEMP/validate-main-pr.log" >&2)

      - name: Upload template validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-validation-logs
          path: |
            ${{ runner.temp }}/validate-*.log
            ${{ runner.temp }}/validate-*.json
            ${{ runner.temp }}/template-source-sha.txt
            ${{ runner.temp }}/template-files.txt
          if-no-files-found: ignore

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Detect branch for push PipelineRun checks
        id: detect-branch
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target_branch="${{ github.event.inputs.branch }}"
          else
            target_branch="${{ github.base_ref }}"
          fi
          if [[ "$target_branch" =~ ^rhoai-[0-9]+\.[0-9]+([-\.].+)?$ ]]; then
            echo "branch=$target_branch" >> "$GITHUB_OUTPUT"
          else
            echo "branch=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout validator scripts from main
        if: github.base_ref != 'main' && github.base_ref != ''
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- script/test_validate_pipelineruns.py script/conftest.py

      - name: Validate PipelineRuns
        id: validate
        env:
          QUAY_RHOAI_READONLY_BOT_AUTH: ${{ secrets.QUAY_RHOAI_READONLY_BOT_AUTH }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_BLOB_URL_PREFIX: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uv run --with pyyaml --with pytest pytest script/test_validate_pipelineruns.py \
            --pipelinerun-dir pipelineruns/ \
            -v \
            --validation-comment-file validation-comment.md \
            ${{ steps.detect-branch.outputs.branch && format('--branch {0}', steps.detect-branch.outputs.branch) || '' }}

      - name: Save PR number
        if: always() && github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload validation comment artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-validation-comment
          path: |
            validation-comment.md
            pr-number.txt
          if-no-files-found: ignore

  validation-comment:
    needs: [validate, validate-templates]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout comment assembler
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Test comment assembler
        run: uv run python -m unittest discover -s script -p test_assemble_validation_comment.py

      - name: Download pytest details
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pytest-validation-comment
          path: pytest-results

      - name: Download template reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: template-validation-logs
          path: template-results

      - name: Assemble combined validation comment
        env:
          PYTEST_RESULT: ${{ needs.validate.result }}
          TEMPLATE_RESULT: ${{ needs.validate-templates.result }}
          TARGET_BRANCH: ${{ github.base_ref }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          uv run script/assemble_validation_comment.py \
            --pytest-result "$PYTEST_RESULT" --template-result "$TEMPLATE_RESULT" \
            --pytest-comment pytest-results/validation-comment.md \
            --template-reports template-results --target-branch "$TARGET_BRANCH" \
            --repository-url "$REPOSITORY_URL" \
            --run-url "$RUN_URL" --output validation-comment.md
          printf '%s\n' "$PR_NUMBER" > pr-number.txt

      - name: Upload combined validation comment
        uses: actions/upload-artifact@v4
        with:
          name: validation-comment
          path: |
            validation-comment.md
            pr-number.txt
          if-no-files-found: error
