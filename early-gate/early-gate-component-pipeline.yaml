apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: early-gate-component-pipeline
spec:
  description: "Early-gate orchestration pipeline for the RHOAI operator and its bundle."

  params:

  # --- Leader PR ---
  - name: leader-pr-repo
    type: string
    description: org/repo of the promoter repository holding the leader PR
  - name: leader-pr-number
    type: string
    description: "Leader PR number."
  - name: operator-repo
    type: string
    default: "red-hat-data-services/rhods-operator"
    description: org/repo of the operator repository to fork and build

  # --- Operator build ---
  - name: operator-output-image
    type: string
    default: "quay.io/rhoai/odh-rhel9-operator"
    description: "Image repository for the operator build, without a tag; the tag is derived from what operator-processor pushed"
  - name: fallback-source-branch
    type: string
    default: "stable"
    description: Operator fork source when no operator PR is included or the leader PR cannot be read
  - name: operator-source-branch
    type: string
    default: "main"
    description: "Operator fork source when the leader PR includes the operator repo."
  - name: rhoai-version
    type: string
    default: ""
    description: "Which RHOAI release this gate run is for, as \"3.5\" or \"rhoai-3.5\"."
  - name: fallback-tag
    type: string
    default: ""
    description: "Quay tag generate-snapshot uses for a component with no PR build."
  - name: triggering-branch
    type: string
    default: ""
    description: "The branch this gate run was triggered on."
  - name: allowed-child-orgs
    type: string
    default: "red-hat-data-services"
    description: "GitHub orgs a child PR listed in the leader PR may come from."
  - name: image-expires-after
    type: string
    default: "7d"
    description: "Expiry for throwaway OCI artifacts (e.g. 1h, 2d, 3w)."
  - name: build-check-name
    type: string
    # Derived from the rhods-operator-eg Component: PaC reports a check-run named
    # after the PipelineRun, and .tekton/rhods-operator-eg-push.yaml names it after
    # the Component. Confirm this string when the Component is created - a mismatch
    # does not fail, it waits out build-timeout-minutes on a check-run that never
    # appears. The Component must be a dedicated early-gate one pushing to
    # quay.io/rhoai/odh-rhel9-operator under early-gate tags.
    default: "rhods-operator-eg-on-push"
    description: "Name of the PaC check-run to watch."
  - name: operator-push-pipeline-path
    type: string
    default: ".tekton/rhods-operator-eg-push.yaml"
    description: "PaC file on the operator's ephemeral branch whose output-image tag is pinned before operator-processor is dispatched."

  # --- Bundle build (Block 2) ---
  - name: build-config-repo
    type: string
    # Block 2 pushes an ephemeral branch here, so the gate needs write access
    default: "red-hat-data-services/RHOAI-Build-Config"
    description: org/repo holding the bundle sources
  - name: build-config-repo-url
    type: string
    default: "https://github.com/red-hat-data-services/RHOAI-Build-Config.git"
    description: "Clone URL for the above."
  - name: build-config-branch-override
    type: string
    # Empty is the normal path: clone-build-config discovers the latest rhoai-X.Y
    default: ""
    description: "Pin the release branch Block 2 forks from instead of discovering the latest rhoai-X.Y."
  - name: bundle-output-image
    type: string
    default: "quay.io/rhoai/odh-operator-bundle"
    description: "Image repository for the bundle build, without a tag; early-gate tags are distinct from release tags"
  - name: bundle-build-check-name
    type: string
    # Derived from the rhods-operator-bundle-eg Component, which builds on push to
    # eg-bundle-*. Keep the dedicated EG Component; the release Component
    # odh-operator-bundle-vX-Y uses the same repository with separate tags and triggers.
    default: "rhods-operator-bundle-eg-on-push"
    description: "Name of the PaC check-run to watch for the bundle."
  - name: bundle-push-pipeline-path
    type: string
    # Must match bundle-processor's PUSH_PIPELINE_PATH default - the same file,
    # named in two places because the processor takes a scratch copy of it and
    # the push task rewrites the real one on the ephemeral branch
    default: ".tekton/odh-operator-bundle-eg-push.yaml"
    description: "PaC file on the ephemeral branch whose output-image tag is pinned before the bundle commit."
  - name: bundle-verify-strict
    type: string
    default: "false"
    description: "Passed to verify-bundle-images."
  - name: defer-bundle-branch-cleanup
    type: string
    default: "false"
    description: "Leave the bundle's ephemeral branch in place instead of deleting it."
  - name: snapshot-operator-key
    type: string
    default: "odh-operator-ci"
    description: Key under which the operator is recorded in config/snapshot.json

  # --- FBC build (Block 3): reuses build-config-repo and -branch-override above ---
  - name: fbc-output-image
    type: string
    default: "quay.io/rhoai/rhoai-fbc-fragment"
    description: "Image repository for the FBC fragment, without a tag; early-gate tags are distinct from release tags"
  - name: fbc-build-check-name
    type: string
    # Derived from the rhoai-fbc-fragment-eg Component, which builds on push to
    # eg-fbc-*. Keep the dedicated EG Component; the release Component
    # rhoai-fbc-fragment-vX-Y uses the same repository with separate tags and triggers.
    default: "rhoai-fbc-fragment-eg-on-push"
    description: "Name of the PaC check-run to watch for the FBC fragment."
  - name: fbc-openshift-version
    type: string
    default: "v4.19"
    description: "DR-F4. Which catalog/<version>/ directory Block 3 regenerates"
  - name: fbc-push-pipeline-component
    type: string
    # Names the early-gate .tekton file, never the release one: fbc-processor
    # rewrites the file this points at, so the release PipelineRun must stay out
    # of reach. Resolves to .tekton/rhoai-fbc-fragment-eg-push.yaml.
    default: "rhoai-fbc-fragment-eg"
    description: "Basename of the .tekton/ PipelineRun file fbc-processor is pointed at with --push-pipeline-yaml-path"
  - name: defer-fbc-branch-cleanup
    type: string
    default: "false"
    description: "Leave Block 3's ephemeral branch in place instead of deleting it, for inspecting a generated catalog after the fact."

  # Intermediate OCI artifacts use the orchestrator's existing push credential.
  - name: trusted-artifacts-repository
    type: string
    default: "quay.io/rhoai/pull-request-pipelines"
    description: "Storage for snapshot and source artifacts, separate from the three build images."

  # --- Self-reference ---
  - name: konflux-central-revision
    type: string
    default: "main"
    description: "Revision of this repository the task definitions below are resolved from."

  # --- Timeouts: sized for the slow case; an expired monitor loses the evidence ---
  - name: processor-timeout-minutes
    type: string
    default: "30"
    description: "Budget for operator-processor, covering GitHub Actions queueing as well as the work itself"
  - name: build-timeout-minutes
    type: string
    default: "270"
    description: "Budget for the operator build; must outlast the 4h ceiling its own push pipeline gives itself"
  - name: bundle-build-timeout-minutes
    type: string
    default: "90"
    description: "Budget for the bundle build; shorter than the operator's - FROM scratch, no compile, no multi-arch fan-out"
  - name: fbc-build-timeout-minutes
    type: string
    default: "150"
    description: "Budget for the FBC build; longer than the bundle's - a ~1GB base image and an opm render, once per architecture"

  results:
  - name: EG_BRANCH
    value: $(tasks.fork-operator-branch.results.branch-name)
  - name: OPERATOR_COMMIT
    value: $(tasks.monitor-operator-processor.results.processor-commit)
  - name: OPERATOR_IMAGE_URL
    value: $(tasks.monitor-operator-build.results.image-ref)
  # Digest, not tag: a bundle references the operator by digest, and eg-<sha> is mutable
  - name: OPERATOR_IMAGE_DIGEST
    value: $(tasks.monitor-operator-build.results.image-digest)
  # Published whole so a consumer need not reassemble repo@digest
  - name: OPERATOR_IMAGE_REF_BY_DIGEST
    value: $(tasks.monitor-operator-build.results.image-ref-by-digest)
  - name: OMITTED_COMPONENT_COUNT
    description: Number omitted; the full report is in the gate-data workspace
    value: $(tasks.generate-snapshot.results.omitted-component-count)
  - name: SNAPSHOT_ARTIFACT
    value: $(tasks.generate-snapshot.results.SNAPSHOT_ARTIFACT)
  - name: BUILD_STATUS
    value: $(tasks.monitor-operator-build.results.build-status)

  # --- Block 2 outputs, for Block 3 (DR-7e): a separate pipeline, so pass them on ---
  - name: EG_BUNDLE_BRANCH
    value: $(tasks.fork-bundle-branch.results.branch-name)
  - name: BUNDLE_RELEASE_BRANCH
    description: The rhoai-X.Y branch Block 2 resolved and forked from
    value: $(tasks.clone-build-config.results.release-branch)
  - name: BUNDLE_COMMIT
    value: $(tasks.push-bundle-to-ephemeral-branch.results.commit-sha)
  - name: BUNDLE_IMAGE_URL
    value: $(tasks.monitor-bundle-build.results.image-ref)
  # Digest, not tag: an FBC references the bundle by digest
  - name: BUNDLE_IMAGE_DIGEST
    value: $(tasks.monitor-bundle-build.results.image-digest)
  - name: BUNDLE_IMAGE_REF_BY_DIGEST
    value: $(tasks.monitor-bundle-build.results.image-ref-by-digest)
  - name: BUNDLE_BUILD_STATUS
    value: $(tasks.monitor-bundle-build.results.build-status)
  # A pipeline result, so it is readable without opening the task log
  - name: BUNDLE_BUILD_URL
    value: $(tasks.monitor-bundle-build.results.build-url)
  - name: BUNDLE_VERIFIED
    description: '"true" when every image in the bundle passed the DR-6 checks'
    value: $(tasks.verify-bundle-images.results.verified)

  # --- Block 3 outputs (DR-F7): what a cluster smoke test would install from ---
  - name: EG_FBC_BRANCH
    value: $(tasks.fork-fbc-branch.results.branch-name)
  - name: FBC_CATALOG_PATH
    description: Repo-relative path of the catalog Block 3 regenerated
    value: $(tasks.fbc-processor.results.catalog-path)
  - name: FBC_BUNDLE_NAME
    description: olm.bundle name the regenerated catalog carries
    value: $(tasks.fbc-processor.results.bundle-name)
  - name: FBC_COMMIT
    value: $(tasks.push-fbc-to-ephemeral-branch.results.commit-sha)
  - name: FBC_IMAGE_URL
    value: $(tasks.monitor-fbc-build.results.image-ref)
  - name: FBC_IMAGE_DIGEST
    value: $(tasks.monitor-fbc-build.results.image-digest)
  - name: FBC_IMAGE_REF_BY_DIGEST
    value: $(tasks.monitor-fbc-build.results.image-ref-by-digest)
  - name: FBC_BUILD_STATUS
    value: $(tasks.monitor-fbc-build.results.build-status)
  - name: FBC_BUILD_URL
    value: $(tasks.monitor-fbc-build.results.build-url)
  - name: FBC_VERIFIED
    description: '"true" when the regenerated catalog passed the DR-F6 checks'
    value: $(tasks.verify-fbc-images.results.verified)

  workspaces:
  - name: gate-data
    description: "Per-run PVC for group configuration and reports; must be shared between TaskRun pods"
  - name: github-credentials
    description: Secret workspace holding a 'token' key with a GitHub API token
  - name: quay-credentials
    description: "dockerconfigjson for the RHOAI Quay read-only robot, used for snapshot and build digest resolution and private bundle rendering"

  tasks:

  # ============================================================
  # BLOCK 0: RESOLVE GROUP CONFIGURATION + SNAPSHOT
  # ============================================================

  # No rhoai-init: this pipeline builds nothing, and 0.3 mounts a slack-config ConfigMap rhoai-tenant lacks

  # Kept for parity with upstream; its build result is not consumed here
  - name: init
    params:
    - name: image-url
      value: $(params.operator-output-image)
    - name: rebuild
      value: "true"
    - name: skip-checks
      value: "true"
    taskRef:
      params:
      - name: name
        value: init
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-init:0.2@sha256:b349d24cb896573695802d6913d311640b44675ec082b3ad167721946a6a0a71
      - name: kind
        value: task
      resolver: bundles

  # --- Group snapshot ---

  # Reads the leader PR once and expands it into the component group
  - name: resolve-group-configuration
    runAfter:
    - init
    params:
    - name: leader-pr-repo
      value: $(params.leader-pr-repo)
    - name: leader-pr-number
      value: $(params.leader-pr-number)
    # The fork-source decision lives in this task, so it needs the operator repo
    - name: operator-repo-name
      value: $(params.operator-repo)
    - name: operator-source-branch
      value: $(params.operator-source-branch)
    - name: fallback-source-branch
      value: $(params.fallback-source-branch)
    - name: triggering-branch
      value: $(params.triggering-branch)
    - name: allowed-orgs
      value: $(params.allowed-child-orgs)
    - name: rhoai-version
      value: $(params.rhoai-version)
    workspaces:
    - name: gate-data
      workspace: gate-data
    # A GitHub token here; generate-snapshot reuses the name for a Quay config
    - name: basic-auth
      workspace: github-credentials
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/resolve-group-configuration.yaml

  # Resolves each component to a digest: its own on-pr-<number> image first,
  # then the shared <component>-<commit> compatibility tag, verifying git.commit
  # against the resolved PR head. If neither is usable, the release-tag fallback
  # is reported on the leader PR because the gate did not test that component's PR code.
  - name: generate-snapshot
    runAfter:
    - resolve-group-configuration
    params:
    - name: leader-pr-number
      value: $(params.leader-pr-number)
    # Both: fallback-tag when set, else derived from rhoai-version inside the task
    - name: fallback-tag
      value: $(params.fallback-tag)
    - name: rhoai-version
      value: $(params.rhoai-version)
    - name: ociStorage
    # Tag is explicit (the param is a bare repo) and uid-scoped, so two runs cannot share one artifact
      value: $(params.trusted-artifacts-repository):eg-$(params.leader-pr-number)-$(context.pipelineRun.uid).snapshot
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    workspaces:
    - name: gate-data
      workspace: gate-data
    - name: basic-auth
      workspace: quay-credentials
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/generate-snapshot-for-group-testing.yaml

  # Logs the snapshot and reports whether the operator is in it
  - name: audit-snapshot
    runAfter:
    - generate-snapshot
    workspaces:
    - name: gate-data
      workspace: gate-data
    taskSpec:
      workspaces:
      - name: gate-data
        readOnly: true
      results:
      - name: pull-request-author
      - name: pull-request-number
      - name: git-repo
      - name: git-org
      - name: git-revision
      - name: snapshot-contains-operator
      volumes:
      - name: workdir
        emptyDir: {}
      stepTemplate:
        volumeMounts:
        - mountPath: /var/workdir
          name: workdir
      steps:
      - name: use-trusted-artifact
        image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:81c4864dae6bb11595f657be887e205262e70086a05ed16ada827fd6391926ac
        args:
        - use
        - $(tasks.generate-snapshot.results.SNAPSHOT_ARTIFACT)=/var/workdir/snapshot
      - name: audit-snapshot
        image: quay.io/konflux-ci/konflux-test:stable
        workingDir: /workspace
        env:
        - name: SNAPSHOT_FILE
          value: /var/workdir/snapshot/snapshot.json
        - name: GATE_DATA
          value: $(workspaces.gate-data.path)
        - name: PR_AUTHOR
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['pipelinesascode.tekton.dev/sender']
        - name: PR_NUMBER
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['pipelinesascode.tekton.dev/pull-request']
        - name: GIT_REPO
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['pipelinesascode.tekton.dev/url-repository']
        - name: GIT_ORG
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['pipelinesascode.tekton.dev/url-org']
        - name: GIT_REVISION
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['pipelinesascode.tekton.dev/sha']
        script: |
          #!/bin/bash
          set -e
          COMPONENTS=$(cat "${GATE_DATA}/group-components.json")
          SNAPSHOT=$(cat "${SNAPSHOT_FILE}")
          echo "SNAPSHOT=${SNAPSHOT}"
          SNAPSHOT_CONTAINS_ODH_OPERATOR=false
          # Parse JSON and iterate through each component
          while IFS= read -r row; do
              COMPONENT_NAME=$(echo "$row" | base64 -d | jq -r '.key')
              IMAGE=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name].image' <<< "${SNAPSHOT}")
              # Match the odh-operator-v3-N family, not a literal; the image check pins it
              if [[ "${COMPONENT_NAME}" =~ ^odh-operator-v3-[0-9]+$ ]] && [[ "${IMAGE}" == "quay.io/rhoai/odh-rhel9-operator"* ]]; then
                  SNAPSHOT_CONTAINS_ODH_OPERATOR=true
              fi
              GIT_COMMIT=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name]."git.commit"' <<< "${SNAPSHOT}")
              GIT_URL=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name]."git.url"' <<< "${SNAPSHOT}")
              echo "${COMPONENT_NAME} IMAGE: ${IMAGE}"
              echo "GIT_COMMIT=${GIT_COMMIT}"
              echo "GIT_URL=${GIT_URL}"
          done < <(echo "$COMPONENTS" | jq -r 'to_entries[] | @base64')

          echo -n "${PR_AUTHOR}" > "$(results.pull-request-author.path)"
          echo -n "${PR_NUMBER}" > "$(results.pull-request-number.path)"
          echo -n "${GIT_REPO}" > "$(results.git-repo.path)"
          echo -n "${GIT_ORG}" > "$(results.git-org.path)"
          echo -n "${GIT_REVISION}" > "$(results.git-revision.path)"
          echo -n "${SNAPSHOT_CONTAINS_ODH_OPERATOR}" > "$(results.snapshot-contains-operator.path)"

  # ============================================================
  # BLOCK 1: OPERATOR
  # ============================================================

  # Always runs; no path here writes to main or stable
  - name: fork-operator-branch
    runAfter:
    - audit-snapshot
    params:
    - name: repo
      value: $(params.operator-repo)
    - name: source-branch
      value: $(tasks.resolve-group-configuration.results.source-branch)
    # eg-<leader-pr>-<uid>; the uid stops two runs on one PR resetting each other's branch
    - name: branch-name
      value: eg-$(params.leader-pr-number)-$(context.pipelineRun.uid)
    workspaces:
    - name: github-credentials
      workspace: github-credentials
    taskSpec:
      params:
      - name: repo
        type: string
      - name: source-branch
        type: string
      - name: branch-name
        type: string
      results:
      - name: branch-name
        description: Name of the created ephemeral branch
      - name: branch-sha
        description: SHA the ephemeral branch was forked at
      workspaces:
      - name: github-credentials
        description: Secret workspace holding a 'token' key
      steps:
      - name: create-branch
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        script: |
          #!/bin/bash
          set -euo pipefail

          REPO="$(params.repo)"
          SOURCE="$(params.source-branch)"
          BRANCH="$(params.branch-name)"
          TOKEN=$(cat "$(workspaces.github-credentials.path)/token")

          # The ref response carries one sha, inside .object
          SOURCE_SHA=$(curl -sS -H "Authorization: token ${TOKEN}" \
            "https://api.github.com/repos/${REPO}/git/ref/heads/${SOURCE}" \
            | grep -o '"sha"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | cut -d'"' -f4 || true)

          if [ -z "${SOURCE_SHA}" ]; then
            echo "Could not resolve head of ${SOURCE} in ${REPO}. Check the branch exists and the token has read access." >&2
            exit 1
          fi
          echo "Forking ${BRANCH} from ${SOURCE} @ ${SOURCE_SHA}"

          # Try to create the branch; if it already exists, force it to match.
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${TOKEN}" \
            -X POST "https://api.github.com/repos/${REPO}/git/refs" \
            -d "{\"ref\":\"refs/heads/${BRANCH}\",\"sha\":\"${SOURCE_SHA}\"}")

          if [ "${HTTP_CODE}" = "422" ]; then
            echo "Branch ${BRANCH} already exists - resetting it to ${SOURCE_SHA}"
            PATCH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${TOKEN}" \
              -X PATCH "https://api.github.com/repos/${REPO}/git/refs/heads/${BRANCH}" \
              -d "{\"sha\":\"${SOURCE_SHA}\",\"force\":true}")
            if [ "${PATCH_CODE}" != "200" ]; then
              echo "Failed to reset ${BRANCH} (HTTP ${PATCH_CODE})" >&2
              exit 1
            fi
          elif [ "${HTTP_CODE}" != "201" ]; then
            echo "Failed to create ${BRANCH} (HTTP ${HTTP_CODE})" >&2
            exit 1
          fi

          echo -n "${BRANCH}" > $(results.branch-name.path)
          echo -n "${SOURCE_SHA}" > $(results.branch-sha.path)

  # Dispatch only; monitor-operator-processor waits, using the run id handed over
  - name: trigger-operator-processor-on-ephemeral-branch
    runAfter:
    - fork-operator-branch
    params:
    - name: repo
      value: $(params.operator-repo)
    - name: branch-name
      value: $(tasks.fork-operator-branch.results.branch-name)
    - name: leader-pr-number
      value: $(params.leader-pr-number)
    - name: rhoai-version
      value: $(params.rhoai-version)
    - name: push-pipeline-path
      value: $(params.operator-push-pipeline-path)
    - name: output-image
      value: $(params.operator-output-image):odh-operator-eg-$(params.leader-pr-number)
    workspaces:
    - name: github-credentials
      workspace: github-credentials
    taskSpec:
      params:
      - name: repo
        type: string
      - name: branch-name
        type: string
      - name: leader-pr-number
        type: string
      - name: rhoai-version
        type: string
        default: ""
      - name: push-pipeline-path
        type: string
        default: ""
      - name: output-image
        type: string
        default: ""
      results:
      - name: previous-run-id
        description: "Newest workflow_dispatch run that existed before we dispatched."
      workspaces:
      - name: github-credentials
        description: Secret workspace holding a 'token' key
      steps:
      # Block 1 has no gate task between forking the branch and the build, because
      # operator-processor makes the commit PaC builds. Pin the image, release
      # pipeline, and RHOAI version here before dispatch so that commit inherits
      # them. An eg-* push cannot use main's PR-oriented build pipeline: its
      # rhoai-init task requires a version for pushes, but main does not pass one.
      #
      # This commit must not itself start a build. The operator CEL fires on
      # "build/operands-map.yaml".pathChanged() or an "early-gate:" subject; this
      # touches only the .tekton file and is deliberately subjected "chore(...)",
      # so it matches neither arm. Changing either the CEL or this subject without
      # the other turns a silent no-op into a build of an unprocessed branch.
      - name: pin-output-image
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        env:
        - name: REPO
          value: $(params.repo)
        - name: BRANCH
          value: $(params.branch-name)
        - name: PUSH_PIPELINE_PATH
          value: $(params.push-pipeline-path)
        - name: OUTPUT_IMAGE
          value: $(params.output-image)
        - name: RHOAI_VERSION
          value: $(params.rhoai-version)
        script: |
          #!/bin/bash
          set -euo pipefail

          if [ -z "${PUSH_PIPELINE_PATH}" ] || [ -z "${OUTPUT_IMAGE}" ]; then
            echo "No push-pipeline-path or output-image given; leaving the branch's PaC file alone."
            exit 0
          fi

          case "${BRANCH}" in
            eg-*) ;;
            *)
              echo "Refusing to write to '${BRANCH}': only eg-* branches (DR-1)." >&2
              exit 1
              ;;
          esac

          microdnf install -y git python3-pyyaml >/dev/null

          TOKEN=$(cat "$(workspaces.github-credentials.path)/token")
          export HOME=/tmp
          git config --global credential.helper 'store --file=/tmp/.git-credentials'
          ( umask 077; printf 'https://x-access-token:%s@github.com\n' "${TOKEN}" > /tmp/.git-credentials )
          unset TOKEN
          git config --global user.name  "rhoai-early-gate[bot]"
          git config --global user.email "rhoai-early-gate@users.noreply.github.com"

          PIN_DIR=/tmp/pin
          git clone --depth 1 --branch "${BRANCH}" "https://github.com/${REPO}.git" "${PIN_DIR}"

          TEKTON_FILE="${PIN_DIR}/${PUSH_PIPELINE_PATH}"
          if [ ! -f "${TEKTON_FILE}" ]; then
            echo "push-pipeline-path '${PUSH_PIPELINE_PATH}' is not on ${BRANCH}." >&2
            echo "Without it the build publishes the templated tag, which" >&2
            echo "monitor-operator-build does not look for." >&2
            exit 1
          fi

          # Edit the YAML structurally: the source revision param and the
          # pipelineRef revision are different values and must not be confused.
          python3 - "${TEKTON_FILE}" <<'PY'
          import os
          from pathlib import Path
          import re
          import sys

          import yaml

          version = os.environ["RHOAI_VERSION"].removeprefix("rhoai-")
          match = re.fullmatch(r"([0-9]+)\.([0-9]+)(?:\.([0-9]+))?", version)
          if not match:
              sys.exit("Cannot pin operator build: rhoai-version must be X.Y, X.Y.Z, or rhoai-X.Y")
          major, minor, patch = match.groups()
          version = f"{major}.{minor}.{patch or '0'}"
          release_branch = f"rhoai-{major}.{minor}"

          path = Path(sys.argv[1])
          document = yaml.safe_load(path.read_text())
          spec = document["spec"]
          reference = spec["pipelineRef"]
          reference_params = {item["name"]: item["value"] for item in reference["params"]}
          if (reference.get("resolver") != "git"
                  or reference_params.get("url", "").removesuffix(".git") != "https://github.com/red-hat-data-services/konflux-central"
                  or reference_params.get("pathInRepo") != "pipelines/multi-arch-container-build.yaml"):
              sys.exit("Refusing to pin an unexpected operator build pipeline reference")

          def set_value(items, name, value):
              matches = [item for item in items if item["name"] == name]
              if len(matches) > 1:
                  sys.exit(f"Duplicate {name} parameter in operator PipelineRun")
              if matches:
                  matches[0]["value"] = value
              else:
                  items.append({"name": name, "value": value})

          set_value(spec["params"], "output-image", os.environ["OUTPUT_IMAGE"])
          set_value(spec["params"], "rhoai-version", version)
          set_value(reference["params"], "revision", release_branch)
          # The release pipeline uses a different Slack switch. EG failures are
          # reported by the orchestrator, not sent to the release team's Slack.
          spec["params"] = [item for item in spec["params"] if item["name"] != "enable-slack-failure-notification"]
          set_value(spec["params"], "disable-slack-notifications", "true")

          path.write_text(yaml.safe_dump(document, sort_keys=False))
          print(f"Pinned operator build: pipeline={release_branch}, rhoai-version={version}, output-image={os.environ['OUTPUT_IMAGE']}")
          PY

          cd "${PIN_DIR}"
          git add -- "${PUSH_PIPELINE_PATH}"
          if git diff --cached --quiet; then
            echo "Operator build inputs already pinned; nothing to push."
          else
            git commit -m "chore(early-gate): pin operator build inputs for this run"
            git push origin "HEAD:${BRANCH}"
            echo "Pinned output-image to ${OUTPUT_IMAGE} on ${BRANCH}"
          fi

          rm -f /tmp/.git-credentials

      - name: dispatch
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        script: |
          #!/bin/bash
          set -euo pipefail

          REPO="$(params.repo)"
          BRANCH="$(params.branch-name)"
          TOKEN=$(cat "$(workspaces.github-credentials.path)/token")

          RUNS_URL="https://api.github.com/repos/${REPO}/actions/runs?branch=${BRANCH}&event=workflow_dispatch&per_page=1"

          # Record the newest pre-existing run, so a stale success cannot pass the gate
          PREV_ID=$(curl -sS -H "Authorization: token ${TOKEN}" "${RUNS_URL}" \
            | grep -o '"id"[[:space:]]*:[[:space:]]*[0-9]*' | head -1 | tr -cd '0-9' || true)
          echo "Newest pre-existing workflow_dispatch run on ${BRANCH}: ${PREV_ID:-none}"
          echo -n "${PREV_ID}" > $(results.previous-run-id.path)

          INPUTS="\"eg-mode\":\"true\",\"eg-branch\":\"${BRANCH}\",\"leader-pr-number\":\"$(params.leader-pr-number)\""

          # Added only when set: GitHub 422s a dispatch carrying an undeclared input
          RHOAI_VERSION="$(params.rhoai-version)"
          if [ -n "${RHOAI_VERSION}" ]; then
            INPUTS="${INPUTS},\"rhoai-version\":\"${RHOAI_VERSION}\""
          else
            echo "WARNING: rhoai-version is empty; operator-processor will guess the" >&2
            echo "         release from the newest rhoai-X.Y branch in ${REPO}." >&2
          fi

          DISPATCH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${TOKEN}" \
            -X POST "https://api.github.com/repos/${REPO}/actions/workflows/operator-processor.yaml/dispatches" \
            -d "{\"ref\":\"${BRANCH}\",\"inputs\":{${INPUTS}}}")

          if [ "${DISPATCH_CODE}" != "204" ]; then
            echo "workflow_dispatch was not accepted (HTTP ${DISPATCH_CODE})" >&2
            if [ "${DISPATCH_CODE}" = "422" ]; then
              echo "  422 is usually one of:" >&2
              echo "    - ref '${BRANCH}' does not exist (deleted by cleanup, or never forked)" >&2
              echo "    - operator-processor.yaml on that ref does not declare an input" >&2
              echo "      being passed here - rhoai-version is the recent addition" >&2
            fi
            exit 1
          fi
          echo "Dispatched operator-processor on ${BRANCH}"

  - name: monitor-operator-processor
    runAfter:
    - trigger-operator-processor-on-ephemeral-branch
    params:
    - name: repo
      value: $(params.operator-repo)
    - name: branch-name
      value: $(tasks.fork-operator-branch.results.branch-name)
    - name: forked-from
      value: $(tasks.resolve-group-configuration.results.source-branch)
    - name: operator-pr-included
      value: $(tasks.resolve-group-configuration.results.operator-pr-included)
    - name: previous-run-id
      value: $(tasks.trigger-operator-processor-on-ephemeral-branch.results.previous-run-id)
    - name: timeout-minutes
      value: $(params.processor-timeout-minutes)
    workspaces:
    - name: github-credentials
      workspace: github-credentials
    taskSpec:
      description: "Waits for the dispatched operator-processor run, then reads back the commit it pushed."
      params:
      - name: repo
        type: string
      - name: branch-name
        type: string
      - name: forked-from
        type: string
      - name: operator-pr-included
        type: string
      - name: previous-run-id
        type: string
      - name: timeout-minutes
        type: string
      results:
      - name: processor-commit
        description: SHA operator-processor pushed to the ephemeral branch
      - name: branch-url
        description: Link to the ephemeral branch
      - name: commit-url
        description: Link to the commit that will be built
      workspaces:
      - name: github-credentials
        description: Secret workspace holding a 'token' key
      steps:
      - name: wait-and-read-commit
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        script: |
          #!/bin/bash
          set -euo pipefail

          REPO="$(params.repo)"
          BRANCH="$(params.branch-name)"
          PREV_ID="$(params.previous-run-id)"
          TOKEN=$(cat "$(workspaces.github-credentials.path)/token")

          RUNS_URL="https://api.github.com/repos/${REPO}/actions/runs?branch=${BRANCH}&event=workflow_dispatch&per_page=1"

          # Poll in 30s steps so the timeout is expressed in minutes.
          ATTEMPTS=$(( $(params.timeout-minutes) * 2 ))
          CONCLUDED=""
          # Announced as soon as the run appears, so the link is followable while polling
          RUN_URL=""

          for i in $(seq 1 "${ATTEMPTS}"); do
            RESP=$(curl -sS -H "Authorization: token ${TOKEN}" "${RUNS_URL}")
            RUN_ID=$(echo "${RESP}" | grep -o '"id"[[:space:]]*:[[:space:]]*[0-9]*' | head -1 | tr -cd '0-9' || true)

            if [ -n "${RUN_ID}" ] && [ "${RUN_ID}" != "${PREV_ID}" ]; then
              if [ -z "${RUN_URL}" ]; then
                RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
                echo "=============================================================="
                echo "operator-processor run detected"
                echo "  Actions run : ${RUN_URL}"
                echo "  Branch      : ${BRANCH}"
                echo "=============================================================="
              fi
              # "conclusion" is null while in progress, so this stays empty until done.
              CONCLUDED=$(echo "${RESP}" | grep -o '"conclusion"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | cut -d'"' -f4 || true)
              if [ -n "${CONCLUDED}" ]; then
                echo "operator-processor run ${RUN_ID} concluded: ${CONCLUDED}"
                break
              fi
            fi

            echo "Waiting for operator-processor... attempt ${i}/${ATTEMPTS}"
            sleep 30
          done

          if [ -z "${CONCLUDED}" ]; then
            echo "Timed out after $(params.timeout-minutes) minutes waiting for operator-processor" >&2
            # Empty means nothing was dispatched, so point at the workflow
            if [ -n "${RUN_URL}" ]; then
              echo "Logs: ${RUN_URL}" >&2
            else
              echo "No workflow_dispatch run ever appeared on ${BRANCH}." >&2
              echo "Logs: https://github.com/${REPO}/actions/workflows/operator-processor.yaml" >&2
            fi
            exit 1
          fi
          if [ "${CONCLUDED}" != "success" ]; then
            echo "operator-processor did not succeed (${CONCLUDED})" >&2
            # Repeated on the failure path, where anyone opening a red task looks
            echo "Logs: ${RUN_URL}" >&2
            exit 1
          fi

          # Read the branch head back rather than assuming it
          SHA=$(curl -sS -H "Authorization: token ${TOKEN}" \
            "https://api.github.com/repos/${REPO}/git/ref/heads/${BRANCH}" \
            | grep -o '"sha"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | cut -d'"' -f4 || true)

          if [ -z "${SHA}" ]; then
            echo "Could not read head of ${BRANCH} after operator-processor finished" >&2
            exit 1
          fi

          if [ "$(params.operator-pr-included)" = "true" ]; then
            WHY="the leader PR includes an operator PR"
          else
            WHY="the leader PR includes no operator PR"
          fi

          BRANCH_URL="https://github.com/${REPO}/tree/${BRANCH}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"

          echo "Built from:"
          echo "  repo          ${REPO}"
          echo "  branch        ${BRANCH}  (forked from $(params.forked-from) - ${WHY})"
          echo "  commit        ${SHA}"
          echo "  branch url    ${BRANCH_URL}"
          echo "  commit url    ${COMMIT_URL}"

          echo -n "${SHA}"         > $(results.processor-commit.path)
          echo -n "${BRANCH_URL}"  > $(results.branch-url.path)
          echo -n "${COMMIT_URL}"  > $(results.commit-url.path)

  # PaC reports the build as a check-run, so follow it over the GitHub API, not Tekton's
  - name: monitor-operator-build
    runAfter:
    - monitor-operator-processor
    # operator-processor commits with --allow-empty; the monitor recovers missed push events.
    params:
    - name: repo
      value: $(params.operator-repo)
    - name: commit
      value: $(tasks.monitor-operator-processor.results.processor-commit)
    - name: branch-name
      value: $(tasks.fork-operator-branch.results.branch-name)
    - name: check-name
      value: $(params.build-check-name)
    - name: output-image
      value: $(params.operator-output-image)
    # Must stay equal to the output-image pinned onto the ephemeral branch by
    # pin-operator-output-image. The branch keeps its uuid; the tag does not.
    - name: image-tag
      value: odh-operator-eg-$(params.leader-pr-number)
    - name: timeout-minutes
      value: $(params.build-timeout-minutes)
    workspaces:
    - name: github-credentials
      workspace: github-credentials
    - name: basic-auth
      workspace: quay-credentials
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/monitor-pac-build.yaml

  # ============================================================
  # BLOCK 2: BUNDLE
  # ============================================================
  # Serialised behind Block 1, whose operator digest it needs

  # DR-1a. Resolves the latest rhoai-X.Y at run time and clones it read-only
  - name: clone-build-config
    runAfter:
    - monitor-operator-build
    params:
    - name: REPO_URL
      value: $(params.build-config-repo-url)
    - name: BRANCH_OVERRIDE
      value: $(params.build-config-branch-override)
    # Intermediate artifacts use the orchestrator's existing push repository.
    - name: ociStorage
      value: $(params.trusted-artifacts-repository):eg-$(params.leader-pr-number)-$(context.pipelineRun.uid).bundle
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/clone-build-config-repo.yaml

  # DR-1b. Forked from clone-build-config's exact SHA; uid in the name so finally can recompute it
  - name: fork-bundle-branch
    runAfter:
    - clone-build-config
    params:
    - name: repo
      value: $(params.build-config-repo)
    - name: source-sha
      value: $(tasks.clone-build-config.results.release-sha)
    - name: branch-name
      value: eg-bundle-$(params.leader-pr-number)-$(context.pipelineRun.uid)
    workspaces:
    - name: github-credentials
      workspace: github-credentials
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/create-ephemeral-branch.yaml

  # DR-2. The operator digest must be in the bundle inputs before processing begins
  - name: update-group-snapshot
    runAfter:
    - fork-bundle-branch
    params:
    - name: SOURCE_ARTIFACT
      value: $(tasks.clone-build-config.results.SOURCE_ARTIFACT)
    - name: SNAPSHOT_ARTIFACT
      value: $(tasks.generate-snapshot.results.SNAPSHOT_ARTIFACT)
    - name: OPERATOR_IMAGE_REF_BY_DIGEST
      value: $(tasks.monitor-operator-build.results.image-ref-by-digest)
    - name: OPERATOR_IMAGE_URL
      value: $(tasks.monitor-operator-build.results.image-ref)
    - name: OPERATOR_IMAGE_DIGEST
      value: $(tasks.monitor-operator-build.results.image-digest)
    - name: SNAPSHOT_OPERATOR_KEY
      value: $(params.snapshot-operator-key)
    - name: ociStorage
      value: $(params.trusted-artifacts-repository):eg-$(params.leader-pr-number)-$(context.pipelineRun.uid).bundle
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/update-group-snapshot.yaml

  # DR-3, DR-4, DR-5. QUAY_TAG is Block 1's tag, never the release branch name
  - name: bundle-processor
    runAfter:
    - update-group-snapshot
    params:
    - name: SOURCE_ARTIFACT
      value: $(tasks.update-group-snapshot.results.SOURCE_ARTIFACT)
    - name: QUAY_TAG
      value: eg-$(tasks.monitor-operator-processor.results.processor-commit)
    - name: OPERATOR_COMPONENT_NAME
      value: $(tasks.update-group-snapshot.results.operator-component-name)
    - name: USE_EXISTING_DIGESTS
      value: "true"
    - name: ociStorage
      value: $(params.trusted-artifacts-repository):eg-$(params.leader-pr-number)-$(context.pipelineRun.uid).bundle
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/bundle-processor.yaml

  # DR-6. The gate's actual assertion, and it runs before the push
  - name: verify-bundle-images
    runAfter:
    - bundle-processor
    params:
    - name: SOURCE_ARTIFACT
      value: $(tasks.bundle-processor.results.SOURCE_ARTIFACT)
    - name: SNAPSHOT_ARTIFACT
      value: $(tasks.generate-snapshot.results.SNAPSHOT_ARTIFACT)
    - name: OPERATOR_IMAGE
      value: $(tasks.update-group-snapshot.results.operator-image)
    - name: RELEASE_BRANCH
      value: $(tasks.clone-build-config.results.release-branch)
    - name: STRICT_MODE
      value: $(params.bundle-verify-strict)
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/verify-bundle-images.yaml

  # DR-1c, DR-1d. The only write to git in the block, and it is to the ephemeral branch
  - name: push-bundle-to-ephemeral-branch
    runAfter:
    - verify-bundle-images
    params:
    - name: SOURCE_ARTIFACT
      value: $(tasks.bundle-processor.results.SOURCE_ARTIFACT)
    - name: repo
      value: $(params.build-config-repo)
    - name: branch-name
      value: $(tasks.fork-bundle-branch.results.branch-name)
    - name: commit-message
      value: "early-gate: pin bundle to gated digests for PR $(params.leader-pr-number)"
    - name: push-pipeline-path
      value: $(params.bundle-push-pipeline-path)
    - name: output-image
      value: $(params.bundle-output-image):odh-operator-bundle-eg-$(params.leader-pr-number)
    workspaces:
    - name: github-credentials
      workspace: github-credentials
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/push-bundle-to-ephemeral-branch.yaml

  # DR-7e. Watches the PaC build and resolves the tag to a digest
  - name: monitor-bundle-build
    runAfter:
    - push-bundle-to-ephemeral-branch
    params:
    - name: repo
      value: $(params.build-config-repo)
    - name: commit
      value: $(tasks.push-bundle-to-ephemeral-branch.results.commit-sha)
    - name: branch-name
      value: $(tasks.fork-bundle-branch.results.branch-name)
    - name: check-name
      value: $(params.bundle-build-check-name)
    - name: output-image
      value: $(params.bundle-output-image)
    # Must stay equal to the output-image push-bundle-to-ephemeral-branch pins
    # onto the branch. The branch keeps its uuid; the tag does not.
    - name: image-tag
      value: odh-operator-bundle-eg-$(params.leader-pr-number)
    - name: timeout-minutes
      value: $(params.bundle-build-timeout-minutes)
    workspaces:
    - name: github-credentials
      workspace: github-credentials
    - name: basic-auth
      workspace: quay-credentials
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/monitor-pac-build.yaml

  # ============================================================
  # BLOCK 3: FBC
  # ============================================================
  # No clone of its own; reuses Block 2's artifact, taken at the same release SHA

  # DR-F1. A second ephemeral branch: sharing Block 2's would retrigger the bundle build
  - name: fork-fbc-branch
    runAfter:
    - monitor-bundle-build
    params:
    - name: repo
      value: $(params.build-config-repo)
    - name: source-sha
      value: $(tasks.clone-build-config.results.release-sha)
    - name: branch-name
      value: eg-fbc-$(params.leader-pr-number)-$(context.pipelineRun.uid)
    workspaces:
    - name: github-credentials
      workspace: github-credentials
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/create-ephemeral-branch.yaml

  # DR-F2, DR-F3. The bundle arrives by digest; an empty one fails rather than templating
  - name: fbc-processor
    runAfter:
    - fork-fbc-branch
    params:
    - name: SOURCE_ARTIFACT
      value: $(tasks.clone-build-config.results.SOURCE_ARTIFACT)
    - name: BUNDLE_IMAGE_URL
      value: $(tasks.monitor-bundle-build.results.image-ref)
    - name: BUNDLE_IMAGE_DIGEST
      value: $(tasks.monitor-bundle-build.results.image-digest)
    - name: QUAY_TAG
      value: eg-$(tasks.monitor-operator-processor.results.processor-commit)
    - name: BRANCH
      value: $(tasks.fork-fbc-branch.results.branch-name)
    - name: OPENSHIFT_VERSION
      value: $(params.fbc-openshift-version)
    - name: FBC_PUSH_PIPELINE_COMPONENT
      value: $(params.fbc-push-pipeline-component)
    # Intermediate artifacts use the orchestrator's existing push repository.
    - name: ociStorage
      value: $(params.trusted-artifacts-repository):eg-$(params.leader-pr-number)-$(context.pipelineRun.uid).fbc
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    workspaces:
    - name: basic-auth
      workspace: quay-credentials
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/fbc-processor.yaml

  # DR-F6. The end-to-end assertion, and it runs before the push
  - name: verify-fbc-images
    runAfter:
    - fbc-processor
    params:
    - name: SOURCE_ARTIFACT
      value: $(tasks.fbc-processor.results.SOURCE_ARTIFACT)
    - name: CATALOG_PATH
      value: $(tasks.fbc-processor.results.catalog-path)
    - name: BUNDLE_NAME
      value: $(tasks.fbc-processor.results.bundle-name)
    - name: BUNDLE_IMAGE
      value: $(tasks.fbc-processor.results.fbc-bundle-image)
    - name: OPERATOR_IMAGE
      value: $(tasks.update-group-snapshot.results.operator-image)
    - name: RELEASE_BRANCH
      value: $(tasks.clone-build-config.results.release-branch)
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/verify-fbc-images.yaml

  # DR-F1. Block 3's only write to git; push-bundle-to-ephemeral-branch is already generic
  - name: push-fbc-to-ephemeral-branch
    runAfter:
    - verify-fbc-images
    params:
    - name: SOURCE_ARTIFACT
      value: $(tasks.fbc-processor.results.SOURCE_ARTIFACT)
    - name: repo
      value: $(params.build-config-repo)
    - name: branch-name
      value: $(tasks.fork-fbc-branch.results.branch-name)
    - name: paths
      value: "catalog"
    - name: commit-message
      value: "early-gate: catalog $(tasks.fbc-processor.results.bundle-name) at gated bundle digest for PR $(params.leader-pr-number)"
    - name: push-pipeline-path
      value: .tekton/$(params.fbc-push-pipeline-component)-push.yaml
    - name: output-image
      value: $(params.fbc-output-image):rhoai-fbc-fragment-eg-$(params.leader-pr-number)
    workspaces:
    - name: github-credentials
      workspace: github-credentials
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/push-bundle-to-ephemeral-branch.yaml

  # DR-F7. Watches the PaC build and resolves the tag to a digest
  - name: monitor-fbc-build
    runAfter:
    - push-fbc-to-ephemeral-branch
    params:
    - name: repo
      value: $(params.build-config-repo)
    - name: commit
      value: $(tasks.push-fbc-to-ephemeral-branch.results.commit-sha)
    - name: branch-name
      value: $(tasks.fork-fbc-branch.results.branch-name)
    - name: check-name
      value: $(params.fbc-build-check-name)
    - name: output-image
      value: $(params.fbc-output-image)
    # Must stay equal to the output-image push-fbc-to-ephemeral-branch pins
    # onto the branch. The branch keeps its uuid; the tag does not.
    - name: image-tag
      value: rhoai-fbc-fragment-eg-$(params.leader-pr-number)
    - name: timeout-minutes
      value: $(params.fbc-build-timeout-minutes)
    # DR-F7. Block 3 ends the chain, so an empty digest has to fail
    - name: require-digest
      value: "true"
    workspaces:
    - name: github-credentials
      workspace: github-credentials
    - name: basic-auth
      workspace: quay-credentials
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/monitor-pac-build.yaml

  finally:

  # ============================================================
  # CLEANUP (finally)
  # ============================================================

  # Two invocations: Tekton skips a finally task that references a failed task's result
  - name: comment-on-leader-pr
    params:
    - name: leader-pr-repo
      value: $(params.leader-pr-repo)
    - name: leader-pr-number
      value: $(params.leader-pr-number)
    - name: status
      value: "success"
    - name: rhoai-version
      value: $(params.rhoai-version)
    - name: eg-branch
      value: $(tasks.fork-operator-branch.results.branch-name)
    - name: source-branch
      value: $(tasks.resolve-group-configuration.results.source-branch)
    - name: fallback-source-branch
      value: $(params.fallback-source-branch)
    - name: operator-pr-included
      value: $(tasks.resolve-group-configuration.results.operator-pr-included)
    - name: pipelinerun-name
      value: $(context.pipelineRun.name)
    # Block outputs by digest and tag from each component's downstream repository
    - name: operator-image
      value: $(tasks.monitor-operator-build.results.image-ref-by-digest)
    - name: operator-image-ref
      value: $(tasks.monitor-operator-build.results.image-ref)
    - name: bundle-image
      value: $(tasks.monitor-bundle-build.results.image-ref-by-digest)
    - name: bundle-image-ref
      value: $(tasks.monitor-bundle-build.results.image-ref)
    - name: bundle-verified
      value: $(tasks.verify-bundle-images.results.verified)
    - name: bundle-build-url
      value: $(tasks.monitor-bundle-build.results.build-url)
    - name: fbc-image
      value: $(tasks.monitor-fbc-build.results.image-ref-by-digest)
    - name: fbc-image-ref
      value: $(tasks.monitor-fbc-build.results.image-ref)
    - name: fbc-verified
      value: $(tasks.verify-fbc-images.results.verified)
    - name: fbc-build-url
      value: $(tasks.monitor-fbc-build.results.build-url)
    - name: fbc-catalog-path
      value: $(tasks.fbc-processor.results.catalog-path)
    # The shared monitor also exposes the operator URL; reporting it is a separate change.
    - name: has-group-config
      value: $(tasks.resolve-group-configuration.results.has-group-config)
    - name: component-count
      value: $(tasks.resolve-group-configuration.results.component-count)
    workspaces:
    - name: gate-data
      workspace: gate-data
    - name: github-credentials
      workspace: github-credentials
    when:
    - input: $(tasks.status)
      operator: in
      values: ["Succeeded"]
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/post-build-complete-comment.yaml

  # The red half; references no task result, which would skip it on the failures that matter
  - name: comment-on-leader-pr-failure
    params:
    - name: leader-pr-repo
      value: $(params.leader-pr-repo)
    - name: leader-pr-number
      value: $(params.leader-pr-number)
    - name: status
      value: "failure"
    - name: rhoai-version
      value: $(params.rhoai-version)
    - name: eg-branch
      value: eg-$(params.leader-pr-number)-$(context.pipelineRun.uid)
    - name: fallback-source-branch
      value: $(params.fallback-source-branch)
    - name: pipelinerun-name
      value: $(context.pipelineRun.name)
    - name: operator-task-status
      value: $(tasks.monitor-operator-build.status)
    - name: bundle-task-status
      value: $(tasks.monitor-bundle-build.status)
    - name: fbc-task-status
      value: $(tasks.monitor-fbc-build.status)
    - name: bundle-verify-status
      value: $(tasks.verify-bundle-images.status)
    - name: fbc-verify-status
      value: $(tasks.verify-fbc-images.status)
    workspaces:
    - name: gate-data
      workspace: gate-data
    - name: github-credentials
      workspace: github-credentials
    when:
    - input: $(tasks.status)
      operator: notin
      values: ["Succeeded"]
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/post-build-complete-comment.yaml

  # Recomputed from the uid: a finally task referencing a failed task's result is skipped
  - name: cleanup-ephemeral-branch
    params:
    - name: repo
      value: $(params.operator-repo)
    - name: branch-name
      value: eg-$(params.leader-pr-number)-$(context.pipelineRun.uid)
    workspaces:
    - name: github-credentials
      workspace: github-credentials
    taskSpec:
      params:
      - name: repo
        type: string
      - name: branch-name
        type: string
      workspaces:
      - name: github-credentials
        description: Secret workspace holding a 'token' key
      steps:
      - name: delete-branch
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        script: |
          #!/bin/bash
          set -euo pipefail

          REPO="$(params.repo)"
          BRANCH="$(params.branch-name)"
          TOKEN=$(cat "$(workspaces.github-credentials.path)/token")

          # Recomputed rather than consumed, so cleanup still runs after a failure
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${TOKEN}" \
            -X DELETE "https://api.github.com/repos/${REPO}/git/refs/heads/${BRANCH}")

          case "${CODE}" in
            204) echo "Deleted ephemeral branch ${BRANCH}" ;;
            404) echo "Branch ${BRANCH} not found - nothing to clean up" ;;
            *)   echo "Could not delete ${BRANCH} (HTTP ${CODE})" >&2 ;;
          esac

  # DR-1e. Deletes Block 2's branch on the shared RHOAI-Build-Config; DR-1f defers it
  - name: cleanup-bundle-ephemeral-branch
    params:
    - name: repo
      value: $(params.build-config-repo)
    - name: branch-name
      value: eg-bundle-$(params.leader-pr-number)-$(context.pipelineRun.uid)
    - name: defer-cleanup
      value: $(params.defer-bundle-branch-cleanup)
    workspaces:
    - name: github-credentials
      workspace: github-credentials
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/cleanup-ephemeral-branch.yaml

  # DR-F1. The same for Block 3's branch
  - name: cleanup-fbc-ephemeral-branch
    params:
    - name: repo
      value: $(params.build-config-repo)
    - name: branch-name
      value: eg-fbc-$(params.leader-pr-number)-$(context.pipelineRun.uid)
    - name: defer-cleanup
      value: $(params.defer-fbc-branch-cleanup)
    workspaces:
    - name: github-credentials
      workspace: github-credentials
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/konflux-central.git
      - name: revision
        value: $(params.konflux-central-revision)
      - name: pathInRepo
        value: early-gate/tasks/cleanup-ephemeral-branch.yaml
