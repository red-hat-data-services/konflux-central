apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: generate-snapshot-for-group-testing
spec:
  description: "Require verified current-head images for active collaborator PRs; release fallback requires confirmed absence of an active sync PR"
  workspaces:
    - name: gate-data
      description: Shared group-components.json input and snapshot report files for this run
    - name: basic-auth
      optional: true
    - name: github-credentials
      description: Read-only GitHub PR state and required component build checks
      optional: true
    - name: konflux-credentials
      description: Read-only Konflux token plus optional api-url, kubearchive-url and ca.crt
      optional: true
  params:
    - name: build-status-source
      type: string
      default: "github"
      description: "Explicit rollout choice: konflux reads live/archive PipelineRuns; never falls back after errors."
    - name: devops-shared-resources-revision
      type: string
      default: "144b62c6777f4ad7b3e27fc6c24cad24b93383fe"
      description: "Shared Konflux helper revision; pin the reviewed commit during rollout."
    - name: fallback-tag
      type: string
      default: ""
      description: "Release tag allowed only after confirming no active collaborator/sync PR exists."
    - name: pr-readiness-timeout-seconds
      type: string
      default: "120"
      description: "Bounded wait for required PR build checks and separately for current-head image availability (1-3600 seconds per phase)."
    - name: rhoai-version
      type: string
      default: ""
      description: "The release this gate run is for, accepted as 3.5, rhoai-3.5 or 3.5.2"
    - name: pr-pipelines-repo
      type: string
      default: rhoai/pull-request-pipelines
      description: "Compatibility probe for PR pipelines using <component>-<commit> tags in a shared repository, without the quay.io/ prefix. Empty disables this probe."
    - name: leader-pr-number
      type: string
      default: ""
      description: Leader PR number.  Overrides the PaC label when set.
    - name: ociStorage
      type: string
      description: OCI repository for storing the SNAPSHOT trusted artifact
    - name: ociArtifactExpiresAfter
      type: string
      default: "1h"
      description: Expiration for the SNAPSHOT OCI artifact
  results:
  - description: OCI trusted artifact URI containing the generated snapshot JSON
    name: SNAPSHOT_ARTIFACT
  - description: Number of components omitted; details are in gate-data/omitted-components.md
    name: omitted-component-count
  volumes:
  - name: workdir
    emptyDir: {}
  stepTemplate:
    volumeMounts:
    - mountPath: /var/workdir
      name: workdir
  steps:
    - name: resolve-pr-image-policy
      image: quay.io/rhoai/rhoai-task-toolset:latest
      env:
      - name: GATE_DATA
        value: $(workspaces.gate-data.path)
      - name: GITHUB_CREDENTIALS_BOUND
        value: $(workspaces.github-credentials.bound)
      - name: GITHUB_CREDENTIALS_PATH
        value: $(workspaces.github-credentials.path)
      - name: PR_READINESS_TIMEOUT_SECONDS
        value: $(params.pr-readiness-timeout-seconds)
      - name: BUILD_STATUS_SOURCE
        value: $(params.build-status-source)
      - name: DEVOPS_SHARED_RESOURCES_REVISION
        value: $(params.devops-shared-resources-revision)
      - name: KONFLUX_CREDENTIALS_BOUND
        value: $(workspaces.konflux-credentials.bound)
      - name: KONFLUX_CREDENTIALS_PATH
        value: $(workspaces.konflux-credentials.path)
      - name: KONFLUX_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: VERIFY_ONLY
        value: "false"
      - name: OMITTED_COUNT_FILE
        value: $(results.omitted-component-count.path)
      script: &pr-image-policy |
        #!/usr/bin/env python3
        """Resolve active PRs independently of image availability; errors forbid fallback."""
        import json
        import os
        from pathlib import Path
        import re
        import sys
        import time
        from urllib.error import HTTPError
        from urllib.request import Request, urlopen

        PR_URL = re.compile(r"https://github\.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/pull/([0-9]+)")
        SUFFIX = re.compile(r"-v[0-9]+-[0-9]+(?:-ea-[0-9]+)?$")
        # These Components have differently named PR PipelineRuns. Keep aliases
        # explicit: stripping prefixes broadly could admit another component's check.
        BUILD_NAME_ALIASES = {
            "odh-mlflow": {"mlflow"},
            "odh-vllm-cpu": {"vllm-cpu"},
            "odh-guardrails-detector-huggingface-runtime": {"odh-guardrails-detector-hf-runtime"},
        }


        class GitHub:
            def __init__(self, token, deadline):
                self.token, self.deadline, self.cache, self.errors = token, deadline, {}, {}

            def get(self, path):
                if path in self.errors:
                    raise RuntimeError(self.errors[path])
                if path not in self.cache:
                    remaining = self.deadline - time.monotonic()
                    if remaining <= 0:
                        raise RuntimeError("PR readiness deadline reached; GitHub state could not be verified")
                    headers = {"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
                    if self.token:
                        headers["Authorization"] = "Bearer " + self.token
                    try:
                        with urlopen(Request("https://api.github.com/" + path, headers=headers),
                                     timeout=min(5, remaining)) as response:
                            self.cache[path] = json.load(response)
                    except HTTPError as exc:
                        self.errors[path] = f"GitHub lookup failed (HTTP {exc.code}); fallback is forbidden"
                        raise RuntimeError(self.errors[path]) from None
                    except Exception:
                        self.errors[path] = "GitHub lookup failed or response was invalid; fallback is forbidden"
                        raise RuntimeError(self.errors[path]) from None
                return self.cache[path]

            def pages(self, path, field=None):
                result = []
                for page in range(1, 21):
                    data = self.get(f"{path}&per_page=100&page={page}")
                    items = data.get(field) if field and isinstance(data, dict) else data
                    if not isinstance(items, list) or any(not isinstance(x, dict) for x in items):
                        raise RuntimeError("Incomplete GitHub listing; fallback is forbidden")
                    result.extend(items)
                    if len(items) < 100:
                        return result
                raise RuntimeError("GitHub pagination limit reached; fallback is forbidden")


        def build_status(checks, component, metadata):
            base_component = SUFFIX.sub("", component)
            names = {base_component,
                     re.sub(r"-rhel[0-9]+$", "", metadata["quay_path"].rsplit("/", 1)[-1])}
            names.update(BUILD_NAME_ALIASES.get(base_component, set()))
            patterns = [re.compile(r"^(?:Konflux Production Internal|Red Hat Konflux) / " + re.escape(n)
                                   + r"-(?:on-pull-request|pull-request)(?:-[0-9]+)?$") for n in names if n]
            matches = [c for c in checks
                       if c.get("app", {}).get("slug") == "konflux-internal-p02"
                       and c.get("head_sha") == metadata["sha"]
                       and isinstance(c.get("id"), int)
                       and any(p.fullmatch(c.get("name", "")) for p in patterns)
                       and (not c.get("pull_requests") or any(
                           str(p.get("number")) == str(metadata["pr"]) for p in c["pull_requests"]))]
            if not matches:
                return "waiting", "No matching component build check for the requested head", ""
            check = max(matches, key=lambda c: c["id"])
            candidate = check.get("html_url", "")
            url = candidate if re.fullmatch(r"https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/runs/[0-9]+", candidate) else ""
            if check.get("status") != "completed":
                return "waiting", "Required component build is still pending", url
            conclusion = check.get("conclusion")
            if conclusion == "success":
                return "ready", "", url
            return "failed", f"Required component build concluded {conclusion or 'unknown'}", url


        def resolve(client, component, metadata):
            if not isinstance(metadata, dict):
                raise RuntimeError("Component repository/PR metadata unavailable; fallback cannot be authorized")
            match = PR_URL.fullmatch(str(metadata.get("pr_url", "")))
            if not match or str(metadata.get("pr", "")) != match[2]:
                raise RuntimeError("Invalid collaborator PR metadata; fallback cannot be authorized")
            repo, number = match.groups()
            pull = client.get(f"repos/{repo}/pulls/{number}")
            if not isinstance(pull, dict) or str(pull.get("number")) != number or pull.get("state") not in {"open", "closed"}:
                raise RuntimeError("Invalid GitHub PR response; fallback cannot be authorized")
            if pull["state"] == "closed":
                # A closed/merged link alone does not establish that no replacement sync exists.
                opened = client.pages(f"repos/{repo}/pulls?state=open&base=stable")
                for other in opened:
                    head, base = other.get("head", {}), other.get("base", {})
                    if (other.get("state") != "open" or not head.get("ref") or not base.get("ref")
                        or not isinstance(head.get("repo"), dict)
                        or not head["repo"].get("full_name")
                        or not isinstance(other.get("number"), int)):
                        raise RuntimeError("Incomplete open-PR metadata; fallback cannot be authorized")
                    if (other.get("state") == "open" and base["ref"] == "stable"
                            and head["ref"] in {"main", "master"}
                            and head.get("repo", {}).get("full_name", "").lower() == repo.lower()):
                        raise RuntimeError(f"Active replacement sync PR #{other.get('number')} exists; refresh the Leader before gating")
                return {"required": False, "reason": "Requested PR is closed/merged and no active main/master-to-stable replacement exists"}
            sha = pull.get("head", {}).get("sha", "")
            if not re.fullmatch(r"[0-9a-f]{40}", sha):
                raise RuntimeError("Active PR head SHA unavailable; fallback is forbidden")
            if metadata.get("sha") and metadata["sha"] != sha:
                raise RuntimeError("Collaborator PR head moved after group resolution; rerun EG for its current head")
            metadata["sha"] = sha
            return {"required": True, "reason": ""}



        def load_konflux_client(token, directory, deadline):
            """Load the same helper used by the Actions monitor at an explicit ref."""
            import base64
            import importlib.util
            from urllib.parse import quote
            revision = os.environ.get("DEVOPS_SHARED_RESOURCES_REVISION", "144b62c6777f4ad7b3e27fc6c24cad24b93383fe")
            if not revision or len(revision) > 200:
                raise RuntimeError("Invalid shared Konflux helper revision")
            endpoint = ("https://api.github.com/repos/red-hat-data-services/devops-shared-resources/"
                        "contents/lib/konflux_builds.py?ref=" + quote(revision, safe=""))
            headers = {"Accept": "application/vnd.github+json"}
            if token:
                headers["Authorization"] = "Bearer " + token
            with urlopen(Request(endpoint, headers=headers), timeout=5) as response:
                payload = json.load(response)
            if payload.get("encoding") != "base64" or payload.get("type") != "file":
                raise RuntimeError("Shared Konflux helper could not be verified")
            source = base64.b64decode("".join(payload["content"].split()), validate=True)
            if len(source) > 100000:
                raise RuntimeError("Shared Konflux helper exceeds expected size")
            path = directory / "konflux_builds.py"
            path.write_bytes(source)
            spec = importlib.util.spec_from_file_location("konflux_builds", path)
            module = importlib.util.module_from_spec(spec)
            sys.modules[spec.name] = module
            spec.loader.exec_module(module)
            if getattr(module, "KONFLUX_BUILD_API_VERSION", None) != 2:
                raise RuntimeError("Shared Konflux helper contract is unsupported")
            if os.environ.get("KONFLUX_CREDENTIALS_BOUND") != "true":
                raise RuntimeError("Konflux read-credential workspace is required for Konflux build truth")
            credentials = Path(os.environ["KONFLUX_CREDENTIALS_PATH"])
            os.environ["KONFLUX_TOKEN_FILE"] = str(credentials / "token")
            for key, variable in (("api-url", "KONFLUX_API_URL"), ("kubearchive-url", "KONFLUX_KUBEARCHIVE_URL")):
                file = credentials / key
                if file.is_file():
                    os.environ[variable] = file.read_text().strip()
            if (credentials / "ca.crt").is_file():
                os.environ["KONFLUX_CA_FILE"] = str(credentials / "ca.crt")
            return module, module.KonfluxClient.from_environment(deadline=deadline)


        def konflux_build_status(module, client, component, metadata):
            repo = PR_URL.fullmatch(metadata["pr_url"])[1]
            names = {SUFFIX.sub("", component),
                     re.sub(r"-rhel[0-9]+$", "", metadata["quay_path"].rsplit("/", 1)[-1])}
            observation = client.observe(
                repo=repo, number=metadata["pr"], sha=metadata["sha"],
                components=names, base_names=True,
            )
            if observation.status == "success":
                return "ready", "", observation.url
            if observation.status in {"failure", "timed_out", "cancelled"}:
                return "failed", f"Required Konflux PipelineRun {observation.status}: {observation.reason}", observation.url
            return "waiting", f"Required Konflux PipelineRun {observation.status}: {observation.reason}", observation.url


        def main():
            directory = Path(os.environ["GATE_DATA"])
            verify_only = os.environ.get("VERIFY_ONLY") == "true"
            previous = json.loads((directory / "pr-image-policy.json").read_text()) if verify_only else {}
            if not verify_only:
                for name in ("required-pr-image-failures.md", "component-table.tsv", "fallback-warning.md", "omitted-components.md"):
                    (directory / name).write_text("")
                if os.environ.get("OMITTED_COUNT_FILE"):
                    Path(os.environ["OMITTED_COUNT_FILE"]).write_text("0")
            components = json.loads((directory / "group-components.json").read_text())
            if not isinstance(components, dict):
                raise ValueError("Expected component object")
            raw_timeout = os.environ.get("PR_READINESS_TIMEOUT_SECONDS", "120")
            if not re.fullmatch(r"[1-9][0-9]*", raw_timeout):
                raise ValueError("PR readiness timeout must be a positive decimal integer")
            timeout = int(raw_timeout)
            if not 1 <= timeout <= 3600:
                raise ValueError("PR readiness timeout must be between 1 and 3600 seconds")
            token = ""
            if os.environ.get("GITHUB_CREDENTIALS_BOUND") == "true":
                try:
                    token = (Path(os.environ["GITHUB_CREDENTIALS_PATH"]) / "token").read_text().strip()
                except OSError:
                    pass
            deadline = time.monotonic() + timeout
            client = GitHub(token, deadline)
            source = os.environ.get("BUILD_STATUS_SOURCE", "github")
            if source not in {"github", "konflux"}:
                raise RuntimeError("Build source must be github or konflux")
            konflux_module = konflux_client = None
            policies = {}
            pending = []
            for component, metadata in components.items():
                try:
                    policy = resolve(client, component, metadata)
                    if verify_only and previous.get(component, {}).get("required") is not policy["required"]:
                        raise RuntimeError("Collaborator PR state changed during image selection; rerun EG")
                    if policy["required"]:
                        pending.append(component)
                    elif isinstance(metadata, dict):
                        metadata["sha"] = ""  # A closed PR must not select an old mutable PR tag.
                    policies[component] = policy
                except Exception as exc:
                    policies[component] = {"required": None, "error": str(exc) if isinstance(exc, RuntimeError)
                                          else "PR lookup could not be verified; fallback is forbidden"}
            if source == "konflux" and pending:
                try:
                    konflux_module, konflux_client = load_konflux_client(token, directory, deadline)
                except Exception as exc:
                    reason = str(exc) if isinstance(exc, RuntimeError) else "Konflux helper or read credentials unavailable"
                    for component in pending:
                        policies[component]["error"] = reason
                    pending = []
            waiting_reason = {}
            while pending:
                if konflux_client is not None:
                    # Parallelize unique PR/head reads, not component probes:
                    # many components share one API snapshot.
                    konflux_client.prefetch_prs([
                        (PR_URL.fullmatch(components[c]["pr_url"])[1],
                         components[c]["pr"], components[c]["sha"])
                        for c in pending
                    ])
                next_pending = []
                for component in pending:
                    metadata, policy = components[component], policies[component]
                    repo = PR_URL.fullmatch(metadata["pr_url"])[1]
                    try:
                        if source == "konflux":
                            state, reason, url = konflux_build_status(konflux_module, konflux_client, component, metadata)
                        else:
                            checks = client.pages(f"repos/{repo}/commits/{metadata['sha']}/check-runs?filter=all", "check_runs")
                            state, reason, url = build_status(checks, component, metadata)
                        policy["build_url"] = url
                        if state == "failed":
                            policy["error"] = reason
                        elif state == "waiting":
                            waiting_reason[component] = reason
                            if time.monotonic() >= deadline:
                                policy["error"] = reason + "; PR readiness deadline reached"
                            else:
                                next_pending.append(component)
                        else:
                            policy["build_ready"] = True
                    except Exception as exc:
                        if component in waiting_reason and isinstance(exc, RuntimeError) and "deadline" in str(exc):
                            policy["error"] = waiting_reason[component] + "; PR readiness deadline reached"
                        else:
                            policy["error"] = str(exc) if isinstance(exc, RuntimeError) else "Build lookup could not be verified"
                if not next_pending:
                    break
                # A known failure already makes this run fail; do not wait for unrelated builds.
                if any(p.get("error") for p in policies.values()):
                    for component in next_pending:
                        policies[component]["error"] = "Required build remains pending; another component already blocks this run"
                    break
                time.sleep(min(10, max(0, deadline - time.monotonic())))
                client.cache = {k: v for k, v in client.cache.items() if "/check-runs?" not in k}
                if konflux_client is not None:
                    konflux_client.clear_cache()
                pending = next_pending
            (directory / "group-components.json").write_text(json.dumps(components))
            (directory / "pr-image-policy.json").write_text(json.dumps(policies))

            failures = []
            for component, policy in policies.items():
                if not policy.get("error"):
                    continue
                metadata = components[component]
                url = metadata.get("pr_url", "") if isinstance(metadata, dict) else ""
                link = f"[Collaborator PR]({url})" if PR_URL.fullmatch(str(url)) else ""
                name = str(component).replace(chr(96), "").replace("\n", " ").replace("|", r"\|")
                failures.append(f"- Component `{name}` — **Required PR image blocked**: {policy['error']}. {link} {policy.get('build_url', '')}")
            (directory / "required-pr-image-failures.md").write_text("\n".join(failures) + ("\n" if failures else ""))
            return not failures


        if __name__ == "__main__":
            try:
                sys.exit(0 if main() else 1)
            except Exception:
                directory = Path(os.environ["GATE_DATA"])
                directory.mkdir(parents=True, exist_ok=True)
                (directory / "required-pr-image-failures.md").write_text(
                    "- PR/image policy could not be evaluated; release fallback was not authorized. See snapshot task logs.\n")
                raise

    - name: generate-snapshot
      image: quay.io/konflux-ci/konflux-test:stable
      workingDir: /workspace
      env:
        - name: GATE_DATA
          value: $(workspaces.gate-data.path)
        - name: FALLBACK_TAG
          value: $(params.fallback-tag)
        - name: RHOAI_VERSION
          value: $(params.rhoai-version)
        - name: PR_READINESS_TIMEOUT_SECONDS
          value: $(params.pr-readiness-timeout-seconds)
        - name: PR_PIPELINES_REPO
          value: $(params.pr-pipelines-repo)
        - name: WORKSPACE_BASIC_AUTH_DIRECTORY_BOUND
          value: $(workspaces.basic-auth.bound)
        - name: WORKSPACE_BASIC_AUTH_DIRECTORY_PATH
          value: $(workspaces.basic-auth.path)
        - name: PR_NUMBER
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['pipelinesascode.tekton.dev/pull-request']
        - name: LEADER_PR_NUMBER
          value: $(params.leader-pr-number)
      script: |
        #!/bin/bash
        set -e

        # Write reports directly to shared storage so finally can read partial
        # output even when this task fails. No report goes through task results.
        FALLBACK_WARNINGS_FILE="${GATE_DATA}/fallback-warning.md"
        COMPONENT_TABLE_FILE="${GATE_DATA}/component-table.tsv"
        OMITTED_FILE="${GATE_DATA}/omitted-components.md"
        : > "$FALLBACK_WARNINGS_FILE"
        : > "$COMPONENT_TABLE_FILE"
        : > "$OMITTED_FILE"
        REQUIRED_FAILURES_FILE="${GATE_DATA}/required-pr-image-failures.md"
        : > "$REQUIRED_FAILURES_FILE"
        POLICY=$(jq -ce 'if type == "object" then . else error("expected policy object") end' "${GATE_DATA}/pr-image-policy.json")
        IMAGE_DEADLINE=$((SECONDS + PR_READINESS_TIMEOUT_SECONDS))
        IMAGE_REASONS_FILE="${GATE_DATA}/fallback-image-reasons.json"
        echo '{}' > "$IMAGE_REASONS_FILE"
        echo -n "0" > "$(results.omitted-component-count.path)"

        # Missing or malformed input is an orchestration error, not an empty group.
        COMPONENTS=$(jq -ce 'if type == "object" then . else error("expected a component object") end' \
          "${GATE_DATA}/group-components.json")
        cat /etc/*release

        # --- Resolve the fallback tag: an explicit one wins, else derive major.minor from rhoai-version ---
        if [[ -z "${FALLBACK_TAG}" ]]; then
          if [[ -z "${RHOAI_VERSION}" ]]; then
            echo "ERROR: neither fallback-tag nor rhoai-version was supplied." >&2
            echo "       One of them has to name the release whose images this" >&2
            echo "       snapshot falls back to.  Deriving 'rhoai-' from an empty" >&2
            echo "       version would match no tag in any repository and drop" >&2
            echo "       every component from the snapshot without saying why." >&2
            exit 1
          fi
          MAJOR_MINOR="${RHOAI_VERSION#rhoai-}"
          if [[ ! "${MAJOR_MINOR}" =~ ^([0-9]+)\.([0-9]+)(\.[0-9]+)?(-ea\.([0-9]+))?$ ]]; then
            echo "ERROR: cannot derive a fallback tag from rhoai-version='${RHOAI_VERSION}'." >&2
            echo "       Expected 3.5, rhoai-3.5 or 3.5.2; got major.minor='${MAJOR_MINOR}'." >&2
            echo "       Pass fallback-tag explicitly if this release does not fit" >&2
            echo "       the rhoai-<major>.<minor> tag convention." >&2
            exit 1
          fi
          FALLBACK_TAG="rhoai-${BASH_REMATCH[1]}.${BASH_REMATCH[2]}${BASH_REMATCH[4]}"
          echo "Derived fallback tag ${FALLBACK_TAG} from rhoai-version='${RHOAI_VERSION}'" >&2
        else
          echo "Using the explicitly supplied fallback tag ${FALLBACK_TAG}" >&2
        fi

        # The basic-auth workspace carries the RHOAI Quay read-only robot credential; optional
        SKOPEO_AUTH=""
        if [[ "${WORKSPACE_BASIC_AUTH_DIRECTORY_BOUND}" == "true" ]]; then
          AUTHFILE="${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.dockerconfigjson"
          if [[ -f "${AUTHFILE}" ]]; then
            SKOPEO_AUTH="--authfile ${AUTHFILE}"
            echo "Using Quay credentials from the basic-auth workspace" >&2
          else
            echo "WARNING: basic-auth workspace is bound but ${AUTHFILE} is absent;" >&2
            echo "         private repositories will fail to resolve." >&2
          fi
        fi

        # --- The explicit leader PR number wins over the PaC label ---
        if [[ -n "${LEADER_PR_NUMBER}" ]]; then
          PR_NUMBER="${LEADER_PR_NUMBER}"
        fi

        json_string="$COMPONENTS"
        echo "${COMPONENTS}"

        # Temporary file to store results
        temp_file=$(mktemp)
        echo "{}" > "$temp_file"

        DEFAULT_PR_NUMBER="${PR_NUMBER}"

        # Inspect once and retain the metadata used to verify the PR head. In
        # particular, on-pr-<number> is mutable: probing it again could select
        # a different build between verification and snapshot creation.
        inspect_pr_image() {
            local candidate_repo="$1" candidate_tag="$2" expected_sha="$3"
            local candidate_commit
            echo "Probing PR build: ${candidate_repo}:${candidate_tag}" >&2
            if ! META=$(skopeo --command-timeout 15s inspect ${SKOPEO_AUTH} --no-tags \
                          --override-arch amd64 --override-os linux \
                          "docker://${candidate_repo}:${candidate_tag}" 2>&1); then
                echo "   PR image inspection failed for ${candidate_repo}:${candidate_tag}:" >&2
                printf '%s\n' "${META}" >&2
                PR_IMAGE_REASON="${PR_IMAGE_REASON}PR image unreadable (missing image or registry inspection/access error). "
                META=""
                return 1
            fi
            if ! candidate_commit=$(jq -er '.Labels["git.commit"] // empty' <<< "${META}" 2>/dev/null); then
                echo "   Rejecting ${candidate_repo}:${candidate_tag}: missing or invalid git.commit metadata" >&2
                PR_IMAGE_REASON="${PR_IMAGE_REASON}PR image has missing or invalid git.commit metadata. "
                META=""
                return 1
            fi
            if [[ "${candidate_commit}" != "${expected_sha}" ]]; then
                echo "   Rejecting ${candidate_repo}:${candidate_tag}: git.commit does not match the PR head" >&2
                echo "   Expected: ${expected_sha}" >&2
                echo "   Found:    ${candidate_commit}" >&2
                PR_IMAGE_REASON="${PR_IMAGE_REASON}PR image git.commit does not match the requested head. "
                META=""
                return 1
            fi
            full_repo="${candidate_repo}"
            TAG="${candidate_tag}"
            echo "✓ Found PR build matching head ${expected_sha}" >&2
        }

        # Parse JSON and iterate through each component
        while IFS= read -r row; do
            # Decode the base64 encoded row
            component=$(echo "$row" | base64 -d | jq -r '.key')
            value_raw=$(echo "$row" | base64 -d | jq -c '.value')

            # Check if value is a string (old format) or object (new format with PR metadata)
            value_type=$(echo "$value_raw" | jq -r 'type')

            component_sha=""
            component_pr_url=""
            if [[ "$value_type" == "object" ]]; then
              # New format: {"quay_path": "...", "pr": "123", "sha": "abc..."}; sha is optional
              repo_path=$(echo "$value_raw" | jq -r '.quay_path')
              component_pr=$(echo "$value_raw" | jq -r '.pr')
              component_sha=$(echo "$value_raw" | jq -r '.sha // ""')
              component_pr_url=$(echo "$value_raw" | jq -r '.pr_url // ""')
              echo "component=${component} (from PR #${component_pr})"
            else
              # Old format: string path
              repo_path=$(echo "$value_raw" | jq -r '.')
              component_pr="${DEFAULT_PR_NUMBER}"
              echo "component=${component} (using default PR #${DEFAULT_PR_NUMBER})"
            fi

            policy=$(jq -ce --arg c "${component}" '.[$c] // error("component policy missing")' <<< "${POLICY}")
            required=$(jq -r '.required | tostring' <<< "${policy}")
            policy_error=$(jq -r '.error // ""' <<< "${policy}")
            build_url=$(jq -r '.build_url // ""' <<< "${policy}")
            if [[ "${required}" != "true" && "${required}" != "false" && -z "${policy_error}" ]]; then
              policy_error="PR policy was not authoritatively resolved; fallback is forbidden"
            fi
            if [[ -n "${policy_error}" ]]; then
              echo "- Component \`${component}\` — **Required PR image blocked**: ${policy_error}. [Collaborator PR](${component_pr_url}) ${build_url}" >> "$REQUIRED_FAILURES_FILE"
              continue
            fi
            echo "repo_path=${repo_path}"

            # Where this component's image will be read from; both are rewritten by whichever probe hits
            full_repo="quay.io/${repo_path}"
            TAG=""
            IMAGE_STATUS=""
            META=""
            PR_IMAGE_REASON=""

            if [[ "${required}" == "true" && ${SECONDS} -ge ${IMAGE_DEADLINE} ]]; then
              echo "- Component \`${component}\` — **Required PR image deadline reached**. [Collaborator PR](${component_pr_url}) ${build_url}" >> "$REQUIRED_FAILURES_FILE"
              continue
            fi

            # --- Normal RHOAI PR output: the component's own repo, tagged on-pr-<number> ---
            # A head SHA is required even for a PR-number tag, so stale images
            # cannot silently stand in for the code this group resolved.
            if [[ "${required}" == "true" && "${component_pr}" =~ ^[0-9]+$ && -n "${component_sha}" ]]; then
              if inspect_pr_image "quay.io/${repo_path}" "on-pr-${component_pr}" "${component_sha}"; then
                IMAGE_STATUS="ready"
              fi
            fi

            # --- Compatibility: some PR pipelines publish shared <component>-<commit> tags ---
            if [[ "${required}" == "true" && -z "${IMAGE_STATUS}" && -n "${PR_PIPELINES_REPO}" && -n "${component_sha}" ]]; then
              # Map keys carry the release, the shared repository's tags do not
              pr_prefix=$(printf '%s' "${component}" | sed -E 's/-v[0-9]+-[0-9]+(-ea-[0-9]+)?$//')
              pr_tag="${pr_prefix}-${component_sha}"
              pr_repo="quay.io/${PR_PIPELINES_REPO}"
              if inspect_pr_image "${pr_repo}" "${pr_tag}" "${component_sha}"; then
                IMAGE_STATUS="ready"
              fi
            fi

            # A completed PR build can take time to appear in Quay. One deadline
            # is shared across the group; never wait N times the configured limit.
            while [[ "${required}" == "true" && -z "${IMAGE_STATUS}" && ${SECONDS} -lt ${IMAGE_DEADLINE} ]]; do
              sleep 5
              if (( SECONDS >= IMAGE_DEADLINE )); then break; fi
              PR_IMAGE_REASON=""
              if inspect_pr_image "quay.io/${repo_path}" "on-pr-${component_pr}" "${component_sha}"; then
                IMAGE_STATUS="ready"
              elif [[ -n "${PR_PIPELINES_REPO}" ]] && inspect_pr_image "${pr_repo}" "${pr_tag}" "${component_sha}"; then
                IMAGE_STATUS="ready"
              fi
            done
            if [[ "${required}" == "true" && -z "${IMAGE_STATUS}" ]]; then
              echo "- Component \`${component}\` — **Required current-head PR image unavailable** at the readiness deadline. [Collaborator PR](${component_pr_url}) ${build_url}. ${PR_IMAGE_REASON}" >> "$REQUIRED_FAILURES_FILE"
              continue
            fi

            # --- No verified PR image: use the release tag ---
            if [[ -z "${IMAGE_STATUS}" ]]; then
              echo "⚠️  WARNING: Component '${component}' has no verified PR image" >&2
              if [[ -z "${component_sha}" ]]; then
                echo "   Skipped PR image probes: no head SHA for this component" >&2
              else
                if [[ ! "${component_pr}" =~ ^[0-9]+$ ]]; then
                  echo "   Skipped the component-repository probe: no valid PR number" >&2
                fi
                echo "   No candidate was readable and matched PR head ${component_sha}" >&2
                echo "   See inspection errors or commit mismatches above" >&2
              fi
              echo "   Action: Falling back to ${FALLBACK_TAG} tag" >&2
              echo "   Impact: Group test will use the released image, not PR code" >&2

              if [[ "${required}" == "false" ]]; then
                PR_IMAGE_REASON=$(jq -r '.reason // "No active collaborator PR; release baseline authorized."' <<< "${policy}")
              elif [[ -z "${component_sha}" ]]; then
                PR_IMAGE_REASON="PR image verification skipped: requested head SHA unavailable."
              elif [[ -z "${PR_IMAGE_REASON}" ]]; then
                PR_IMAGE_REASON="No readable PR image matched the requested head."
              fi
              jq --arg component "${component}" --arg reason "${PR_IMAGE_REASON}" \
                 '. + {($component): $reason}' "$IMAGE_REASONS_FILE" > "${IMAGE_REASONS_FILE}.tmp"
              mv "${IMAGE_REASONS_FILE}.tmp" "$IMAGE_REASONS_FILE"

              # Track this fallback for PR comment
              if [[ "$value_type" == "object" ]]; then
                DISPLAY_COMPONENT=$(printf '%s' "${component}" | sed -E 's/-v[0-9]+-[0-9]+(-ea-[0-9]+)?$//')
                FALLBACK_PR="PR #${component_pr}"
                if [[ "${component_pr_url}" =~ ^https://github\.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/pull/([0-9]+)$ ]] \
                    && [[ "${BASH_REMATCH[2]}" == "${component_pr}" ]]; then
                  FALLBACK_PR="[${BASH_REMATCH[1]}#${component_pr}](${component_pr_url})"
                fi
                echo "- Component \`${DISPLAY_COMPONENT}\` from ${FALLBACK_PR}: using \`${FALLBACK_TAG}\` — **Build diagnostics unavailable**. ${PR_IMAGE_REASON}" >> "$FALLBACK_WARNINGS_FILE"
              fi

              full_repo="quay.io/${repo_path}"
              TAG=${FALLBACK_TAG}
              IMAGE_STATUS="fallback"
            fi

            echo "Processing component: $component" >&2
            echo "Repository: $full_repo" >&2

            # Reuse verified PR metadata; only the release fallback needs another inspect.
            if [[ -z "${META}" ]] && ! META=$(skopeo --command-timeout 15s inspect ${SKOPEO_AUTH} --no-tags \
                          --override-arch amd64 --override-os linux \
                          "docker://${full_repo}:${TAG}" 2>&1); then
                echo "Warning: could not inspect ${full_repo}:${TAG}" >&2
                echo "${META}" >&2
                manifest_digest=""
                full_image_uri="${full_repo}:${TAG}"
                git_url=""
                git_commit=""
            else
                manifest_digest=$(jq -r '.Digest // empty' <<< "${META}")
                git_url=$(jq -r '.Labels["git.url"] // empty' <<< "${META}")
                git_commit=$(jq -r '.Labels["git.commit"] // empty' <<< "${META}")

                if [ -z "${manifest_digest}" ]; then
                    echo "Warning: No digest found for $component with tag $TAG" >&2
                    full_image_uri="${full_repo}:${TAG}"
                else
                    echo "Found digest: $manifest_digest" >&2
                    full_image_uri="${full_repo}@${manifest_digest}"
                fi

                echo "Git URL: $git_url" >&2
                echo "Git Commit: $git_commit" >&2
            fi

            if [[ "${required}" == "true" ]] && { [[ -z "${git_url}" || -z "${git_commit}" ]] || [[ ! "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; }; then
              echo "- Component \`${component}\` — **Required PR image has invalid digest or source labels**. [Collaborator PR](${component_pr_url}) ${build_url}" >> "$REQUIRED_FAILURES_FILE"
              continue
            fi

            # A component that cannot be resolved is omitted and recorded, rather than taking the run down
            if [ -z "$git_url" ] || [ -z "$git_commit" ]; then
                echo "⚠️  WARNING: no resolvable image for ${component} (${full_repo}:${TAG})" >&2
                echo "   Omitting it from the snapshot." >&2
                echo "- \`${component}\` (\`${full_repo}:${TAG}\`): no image or no git.url/git.commit labels" >> "$OMITTED_FILE"
                echo "" >&2
                continue
            fi

            # Add to output JSON with image URI, git.url, and git.commit
            jq --arg key "$component" \
               --arg image "$full_image_uri" \
               --arg giturl "$git_url" \
               --arg gitcommit "$git_commit" \
               --arg image_tag "$TAG" \
               '. + {($key): {image: $image, "git.url": $giturl, "git.commit": $gitcommit, "image_tag": $image_tag}}' \
               "$temp_file" > "${temp_file}.tmp" && mv "${temp_file}.tmp" "$temp_file"

            # Add to component table for PR comment (only for group testing components)
            if [[ "$value_type" == "object" ]]; then
              SHORT_DIGEST=$(echo "$manifest_digest" | cut -c 1-12)
              if [[ -z "$SHORT_DIGEST" ]]; then
                SHORT_DIGEST="N/A"
              fi
              echo "${component_pr}|${component}|${TAG}|${IMAGE_STATUS}|${SHORT_DIGEST}|${component_pr_url}" >> "$COMPONENT_TABLE_FILE"
            fi

            echo "" >&2
        done < <(echo "$json_string" | jq -r 'to_entries[] | @base64')

        if [[ -s "$REQUIRED_FAILURES_FILE" ]]; then
          echo "ERROR: required collaborator PR images were not validated; no release substitutions or trusted artifact will be published." >&2
          cat "$REQUIRED_FAILURES_FILE" >&2
          rm -f "$temp_file"
          exit 1
        fi

        # Print final output JSON
        echo "Output JSON:" >&2
        cat "$temp_file" | jq '.'

        # Write snapshot to trusted artifact directory
        mkdir -p /var/workdir/snapshot
        cp "$temp_file" /var/workdir/snapshot/snapshot.json
        echo "Snapshot written to /var/workdir/snapshot/snapshot.json" >&2

        # Only the count is a task result; the full report stays on the PVC.
        OMITTED_COUNT=$(wc -l < "$OMITTED_FILE" | tr -d '[:space:]')
        echo -n "${OMITTED_COUNT}" > "$(results.omitted-component-count.path)"
        if [[ -s "$OMITTED_FILE" ]]; then
          echo "" >&2
          echo "⚠️  Components omitted from the snapshot:" >&2
          cat "$OMITTED_FILE" >&2
        fi

        # Cleanup
        rm -f "$temp_file"

    - name: verify-pr-image-policy
      image: quay.io/rhoai/rhoai-task-toolset:latest
      env:
      - name: GATE_DATA
        value: $(workspaces.gate-data.path)
      - name: GITHUB_CREDENTIALS_BOUND
        value: $(workspaces.github-credentials.bound)
      - name: GITHUB_CREDENTIALS_PATH
        value: $(workspaces.github-credentials.path)
      - name: PR_READINESS_TIMEOUT_SECONDS
        value: $(params.pr-readiness-timeout-seconds)
      - name: BUILD_STATUS_SOURCE
        value: $(params.build-status-source)
      - name: DEVOPS_SHARED_RESOURCES_REVISION
        value: $(params.devops-shared-resources-revision)
      - name: KONFLUX_CREDENTIALS_BOUND
        value: $(workspaces.konflux-credentials.bound)
      - name: KONFLUX_CREDENTIALS_PATH
        value: $(workspaces.konflux-credentials.path)
      - name: KONFLUX_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: VERIFY_ONLY
        value: "true"
      script: *pr-image-policy

    - name: describe-fallback-builds
      image: quay.io/rhoai/rhoai-task-toolset:latest
      onError: continue
      env:
      - name: BUILD_STATUS_SOURCE
        value: $(params.build-status-source)
      - name: GATE_DATA
        value: $(workspaces.gate-data.path)
      - name: GITHUB_CREDENTIALS_BOUND
        value: $(workspaces.github-credentials.bound)
      - name: GITHUB_CREDENTIALS_PATH
        value: $(workspaces.github-credentials.path)
      script: |
        #!/usr/bin/env python3
        """Enrich fallback reports only; never change the selected snapshot images."""
        import json
        import os
        from pathlib import Path
        import re
        import sys
        import time
        from datetime import datetime, timezone
        from urllib.parse import urlparse
        from urllib.request import Request, urlopen

        if os.environ.get("BUILD_STATUS_SOURCE") == "konflux":
            # Closed-PR fallback reasons are already in the policy report.
            # Do not add independent GitHub build-status interpretations.
            sys.exit(0)

        RELEASE_SUFFIX = re.compile(r"-v[0-9]+-[0-9]+(?:-ea-[0-9]+)?$")
        PR_URL = re.compile(r"https://github\.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/pull/([0-9]+)")


        def inline(value):
            return chr(96) + str(value).replace(chr(96), "").replace("\n", " ") + chr(96)


        def build_link(check):
            # Prefer GitHub's check page. Never fetch any URL supplied in a check response.
            url = check.get("html_url", "")
            parsed = urlparse(url)
            if parsed.scheme == "https" and parsed.netloc == "github.com" and re.fullmatch(
                    r"/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/runs/[0-9]+", parsed.path):
                return url
            return ""


        class Checks:
            def __init__(self, token):
                self.token = token
                self.cache = {}
                self.deadline = time.monotonic() + 60

            def for_head(self, repo, sha):
                key = (repo, sha)
                if key not in self.cache:
                    try:
                        self.cache[key] = self.fetch(repo, sha)
                    except Exception:
                        # Authentication, pagination, malformed responses and network errors
                        # are unknown diagnostics, never evidence that no build triggered.
                        self.cache[key] = None
                return self.cache[key]

            def fetch(self, repo, sha):
                if not self.token:
                    raise RuntimeError("GitHub credentials unavailable")
                result = []
                for page in range(1, 21):
                    remaining = self.deadline - time.monotonic()
                    if remaining <= 0:
                        raise RuntimeError("Diagnostic time budget exhausted")
                    url = (f"https://api.github.com/repos/{repo}/commits/{sha}/check-runs"
                           f"?per_page=100&filter=all&page={page}")
                    request = Request(url, headers={
                        "Authorization": "Bearer " + self.token,
                        "Accept": "application/vnd.github+json",
                        "X-GitHub-Api-Version": "2022-11-28",
                    })
                    with urlopen(request, timeout=min(5, remaining)) as response:
                        data = json.load(response)
                    if not isinstance(data, dict) or not isinstance(data.get("check_runs"), list):
                        raise ValueError("Invalid check-runs response")
                    checks = data["check_runs"]
                    if any(not isinstance(check, dict) for check in checks):
                        raise ValueError("Invalid check-run")
                    result.extend(checks)
                    if len(checks) < 100:
                        return result
                raise RuntimeError("Check pagination limit reached")


        def classify(checks, component, metadata):
            if checks is None:
                return "unavailable", "Build diagnostics unavailable", ""
            # Component keys may be aliases, so also consider the configured image repo.
            names = {RELEASE_SUFFIX.sub("", component)}
            repo_name = str(metadata.get("quay_path", "")).rsplit("/", 1)[-1]
            names.add(re.sub(r"-rhel[0-9]+$", "", repo_name))
            names.discard("")
            patterns = [
                re.compile(r"^(?:Konflux Production Internal|Red Hat Konflux) / "
                           + re.escape(name) + r"-(?:on-pull-request|pull-request)(?:-[0-9]+)?$")
                for name in names
            ]
            matches = []
            for check in checks:
                if check.get("head_sha") != metadata["sha"]:
                    continue
                if not any(pattern.fullmatch(check.get("name", "")) for pattern in patterns):
                    continue
                prs = check.get("pull_requests", [])
                if prs and not any(str(pr.get("number")) == str(metadata["pr"]) for pr in prs):
                    continue
                if not isinstance(check.get("id"), int):
                    continue
                matches.append(check)
            if not matches:
                return "not_found", "No matching build check found for the requested head", ""
            # A newer retry supersedes an older failure, including a retry still queued.
            check = max(matches, key=lambda item: item["id"])
            url = build_link(check)
            status = check.get("status")
            if status in {"queued", "requested", "waiting", "pending"}:
                return "pending", "Build queued or waiting", url
            if status == "in_progress":
                return "running", "Build running", url
            if status != "completed":
                return "unavailable", "Build diagnostics unavailable", url
            conclusion = check.get("conclusion")
            states = {
                "failure": ("failed", "Build failed"),
                "cancelled": ("cancelled", "Build cancelled"),
                "timed_out": ("timed_out", "Build timed out"),
                "success": ("unusable", "Build succeeded, but no usable PR image"),
                "skipped": ("skipped", "Build check skipped"),
                "neutral": ("neutral", "Build check completed with a neutral conclusion"),
                "action_required": ("action_required", "Build requires action"),
                "startup_failure": ("failed", "Build failed to start"),
                "stale": ("stale", "Build check became stale"),
            }
            state, message = states.get(conclusion, ("unavailable", "Build diagnostics unavailable"))
            return state, message, url


        def main():
            directory = Path(os.environ["GATE_DATA"])
            table = directory / "component-table.tsv"
            if not table.exists():
                return
            components = json.loads((directory / "group-components.json").read_text())
            reasons_file = directory / "fallback-image-reasons.json"
            reasons = json.loads(reasons_file.read_text()) if reasons_file.exists() else {}
            token = ""
            if os.environ.get("GITHUB_CREDENTIALS_BOUND") == "true":
                try:
                    token = (Path(os.environ["GITHUB_CREDENTIALS_PATH"]) / "token").read_text().strip()
                except OSError:
                    pass
            policy_file = directory / "pr-image-policy.json"
            policy = json.loads(policy_file.read_text()) if policy_file.exists() else {}
            client = Checks(token)
            observed = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
            lines = []
            diagnostics = {}
            for row in table.read_text().splitlines():
                cells = row.split("|")
                if len(cells) < 5 or cells[3] != "fallback":
                    continue
                pr, component, tag = cells[:3]
                metadata = components.get(component, {})
                url = metadata.get("pr_url", "") if isinstance(metadata, dict) else ""
                match = PR_URL.fullmatch(url)
                valid = match and match[2] == pr
                label = f"PR #{pr}" if pr.isdigit() else "Requested PR"
                if valid:
                    label = f"[{match[1]}#{pr}]({url})"
                sha = metadata.get("sha", "") if isinstance(metadata, dict) else ""
                if policy.get(component, {}).get("required") is False:
                    state, message, check_url = ("no_active_pr", "No active sync PR; release baseline authorized", "")
                elif valid and re.fullmatch(r"[0-9a-fA-F]{40}", sha):
                    # Use the resolved SHA; never substitute the PR's newer mutable head.
                    state, message, check_url = classify(
                        client.for_head(match[1], sha), component, dict(metadata, pr=pr))
                else:
                    state, message, check_url = (
                        "unavailable", "Build diagnostics unavailable (collaborator URL or head SHA missing)", "")
                reason = str(reasons.get(component, "No verified PR image; see snapshot task logs.")).strip()
                link = f" · [Build check]({check_url})" if check_url else ""
                display = RELEASE_SUFFIX.sub("", component)
                lines.append(f"- Component {inline(display)} from {label}: using {inline(tag)} — "
                             f"**{message}**{link}. {reason}")
                diagnostics[component] = {
                    "requested_pr_url": url if valid else "", "head_sha": sha,
                    "state": state, "check_url": check_url, "image_reason": reason,
                    "observed_at": observed,
                }
            if not lines:
                return
            report = "\n".join(lines) + f"\n\nBuild diagnostics observed at {inline(observed)}.\n"
            temporary = directory / "fallback-warning.md.tmp"
            temporary.write_text(report)
            temporary.replace(directory / "fallback-warning.md")
            (directory / "fallback-build-diagnostics.json").write_text(json.dumps(diagnostics, indent=2))


        if __name__ == "__main__":
            try:
                main()
            except Exception:
                # Keep the original fallback report on any enrichment error.
                print("WARNING: fallback build diagnostics unavailable; retaining the snapshot report.", file=sys.stderr)

    - name: create-trusted-artifact
      image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:81c4864dae6bb11595f657be887e205262e70086a05ed16ada827fd6391926ac
      args:
      - create
      - --store
      - $(params.ociStorage)
      - $(results.SNAPSHOT_ARTIFACT.path)=/var/workdir/snapshot
      env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
