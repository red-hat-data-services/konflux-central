apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: monitor-pac-build
spec:
  description: "Waits for the PaC-triggered build on a pushed commit and reports the image it produced, by digest."
  params:
  - name: repo
    type: string
    description: org/repo the commit was pushed to
  - name: commit
    type: string
    description: Commit SHA whose check-runs to watch
  - name: check-name
    type: string
    description: "Substring of the PaC check-run name."
  - name: branch-name
    type: string
    default: ""
    description: "Ephemeral branch for /test recovery; empty disables recovery. check-name must be the PaC PipelineRun name when enabled."
  - name: trigger-wait-seconds
    type: string
    default: "120"
    description: "Wait for a check before the first trigger comment and between retries."
  - name: max-trigger-attempts
    type: string
    default: "3"
    description: "Maximum trigger comment attempts while no matching check has ever appeared."
  - name: output-image
    type: string
    description: Image repository the build pushes to, without a tag
  - name: image-tag
    type: string
    default: ""
    description: "Tag the build applies."
  - name: timeout-minutes
    type: string
    default: "60"
  - name: require-digest
    type: string
    default: "false"
    description: "Whether an unresolvable digest fails this task."
  results:
  - name: build-status
    description: success, failure, or timeout
  - name: image-ref
    description: The image the build produced, by tag
  - name: image-digest
    description: "Digest the tag resolves to."
  - name: image-ref-by-digest
    description: "The same image pinned by digest, as <repo>@<digest>"
  - name: build-url
    description: "Konflux UI PipelineRun for the build this task watched - the check-run's details_url."
  - name: check-run-url
    description: "GitHub check-run for the same build; all there is to go on when the Konflux UI is unreachable"
  workspaces:
  - name: github-credentials
    description: Secret workspace holding a 'token' key
  - name: basic-auth
    optional: true
    description: "Read-only registry credentials with a .dockerconfigjson key; needed for private images."
  steps:
  - name: watch-build
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    env:
    - name: REGISTRY_AUTH_BOUND
      value: $(workspaces.basic-auth.bound)
    - name: REGISTRY_AUTH_DIRECTORY
      value: $(workspaces.basic-auth.path)
    script: |
      #!/bin/bash
      set -euo pipefail

      microdnf install -y jq skopeo >/dev/null

      REPO="$(params.repo)"
      SHA="$(params.commit)"
      CHECK="$(params.check-name)"
      BRANCH="$(params.branch-name)"
      TRIGGER_WAIT="$(params.trigger-wait-seconds)"
      MAX_TRIGGERS="$(params.max-trigger-attempts)"
      if ! [[ "${TRIGGER_WAIT}" =~ ^[1-9][0-9]*$ && "${MAX_TRIGGERS}" =~ ^[0-9]+$ ]]; then
        echo "Invalid trigger wait or attempt limit" >&2
        exit 1
      fi
      # No "eg-${SHA}" fallback any more - see the image-tag param description
      TAG="$(params.image-tag)"
      if [ -z "${TAG}" ]; then
        echo "ERROR: image-tag is empty." >&2
        echo "  Pass the full tag the build applies, component prefix included," >&2
        echo "  e.g. rhods-operator-eg-<leader-pr>-<sha>.  It must match" >&2
        echo "  output-image in the PaC PipelineRun this task is watching." >&2
        exit 1
      fi

      TOKEN=$(cat "$(workspaces.github-credentials.path)/token")

      IMAGE_REF="$(params.output-image):${TAG}"
      echo -n "${IMAGE_REF}" > $(results.image-ref.path)

      # Written before anything can fail: a declared result with no value is an error in its own right
      echo -n "" > $(results.image-digest.path)
      echo -n "" > $(results.image-ref-by-digest.path)
      echo -n "" > $(results.build-url.path)
      echo -n "" > $(results.check-run-url.path)

      # Skopeo handles registry authentication from the same read-only robot
      # used by snapshot generation. .Digest identifies the source manifest/index.
      resolve_digest() {
        local auth_args=()
        if [ "${REGISTRY_AUTH_BOUND}" = "true" ]; then
          local authfile="${REGISTRY_AUTH_DIRECTORY}/.dockerconfigjson"
          if [ ! -s "${authfile}" ]; then
            echo "Registry credentials workspace is bound but .dockerconfigjson is missing or empty." >&2
            return 1
          fi
          auth_args=(--authfile "${authfile}")
        fi
        skopeo inspect "${auth_args[@]}" --no-tags \
          --override-os linux --override-arch amd64 \
          --format '{{.Digest}}' "docker://${IMAGE_REF}"
      }

      CHECKS_URL="https://api.github.com/repos/${REPO}/commits/${SHA}/check-runs?per_page=100"
      # SECONDS is Bash's elapsed clock: API latency counts against the budget.
      DEADLINE=$(( SECONDS + $(params.timeout-minutes) * 60 ))
      NEXT_TRIGGER=$(( SECONDS + TRIGGER_WAIT ))
      TRIGGERS=0

      # A failed or malformed GitHub response is unknown, never "no checks".
      # Read every page so unrelated checks cannot hide the desired build.
      read_checks() {
        local page=1 response runs='[]' count
        while :; do
          response=$(curl -fsS --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 2 --retry-max-time 30 \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" "${CHECKS_URL}&filter=all&page=${page}") || return 1
          jq -e '.check_runs | type == "array"' <<< "${response}" >/dev/null || return 1
          runs=$(jq -cn --argjson previous "${runs}" --argjson response "${response}" \
            '$previous + $response.check_runs') || return 1
          count=$(jq '.check_runs | length' <<< "${response}")
          [ "${count}" -eq 100 ] || break
          page=$(( page + 1 ))
        done
        # IDs order registration even when a queued check has no started_at.
        jq -c --arg c "${CHECK}" \
          '[.[] | select(.name | contains($c))] | sort_by(.id) | last // {}' <<< "${runs}"
      }

      recover_push() {
        local head payload
        # PaC comments run in branch context. Never trigger a different head.
        head=$(curl -fsS --connect-timeout 10 --max-time 20 \
          --retry 2 --retry-delay 2 --retry-max-time 30 \
          -H "Authorization: token ${TOKEN}" \
          "https://api.github.com/repos/${REPO}/git/ref/heads/${BRANCH}" | jq -er '.object.sha') || return 1
        if [ "${head}" != "${SHA}" ]; then
          echo "Branch ${BRANCH} no longer points at monitored commit ${SHA}; refusing to trigger." >&2
          echo -n "failure" > $(results.build-status.path)
          exit 1
        fi
        # Recheck immediately before posting, including after a slow head lookup.
        RUN=$(read_checks) || return 1
        [ "${RUN}" = "{}" ] || return 0
        [ "${SECONDS}" -lt "${DEADLINE}" ] || return 0
        TRIGGERS=$(( TRIGGERS + 1 ))
        payload=$(jq -cn --arg body "/test ${CHECK} branch:${BRANCH}" '{body: $body}')
        echo "PaC check missing; trigger ${TRIGGERS}/${MAX_TRIGGERS}: /test ${CHECK} branch:${BRANCH}"
        # Do not auto-retry POST: a lost response may still mean it was accepted.
        # Wait and check GitHub again before consuming another bounded attempt.
        if ! curl -fsS --connect-timeout 10 --max-time 20 \
          -H "Authorization: token ${TOKEN}" -H "Accept: application/vnd.github+json" \
          -H "Content-Type: application/json" -X POST --data "${payload}" \
          "https://api.github.com/repos/${REPO}/commits/${SHA}/comments" >/dev/null; then
          echo "Trigger comment failed or response was lost; will check GitHub before retrying." >&2
        fi
        NEXT_TRIGGER=$(( SECONDS + TRIGGER_WAIT ))
      }

      # Konflux UI run and check-run URLs, announced once; initialised here because the timeout path reads them
      BUILD_ANNOUNCED=""
      BUILD_UI_URL=""
      BUILD_CHECK_URL=""

      while [ "${SECONDS}" -lt "${DEADLINE}" ]; do
        if ! RUN=$(read_checks); then
          echo "Could not read GitHub checks; retrying without triggering a build." >&2
          sleep 30
          continue
        fi

        if [ "${RUN}" = "{}" ] && [ -z "${BUILD_ANNOUNCED}" ] && \
           [ -n "${BRANCH}" ] && [ "${MAX_TRIGGERS}" -gt 0 ] && \
           [ "${SECONDS}" -ge "${NEXT_TRIGGER}" ] && [ "${SECONDS}" -lt "${DEADLINE}" ]; then
          if [ "${TRIGGERS}" -ge "${MAX_TRIGGERS}" ]; then
            echo "PaC never registered '${CHECK}' on ${SHA} after ${TRIGGERS} trigger attempts." >&2
            echo -n "failure" > $(results.build-status.path)
            exit 1
          fi
          if ! recover_push; then
            echo "Could not verify branch/checks; retrying without posting a comment." >&2
            sleep 30
            continue
          fi
        fi

        STATUS=$(jq -r '.status // ""' <<< "${RUN}")
        CONCLUSION=$(jq -r '.conclusion // ""' <<< "${RUN}")
        BUILD_UI_URL=$(jq -r '.details_url // ""' <<< "${RUN}")
        BUILD_CHECK_URL=$(jq -r '.html_url // ""' <<< "${RUN}")

        if [ -n "${STATUS}" ] && [ -z "${BUILD_ANNOUNCED}" ]; then
          BUILD_ANNOUNCED="yes"
          echo -n "${BUILD_UI_URL}"    > $(results.build-url.path)
          echo -n "${BUILD_CHECK_URL}" > $(results.check-run-url.path)
          echo "=============================================================="
          echo "Build registered: ${CHECK}"
          echo "  Konflux UI : ${BUILD_UI_URL}"
          echo "  Check run  : ${BUILD_CHECK_URL}"
          echo "  Commit     : ${SHA}"
          echo "=============================================================="
        fi

        if [ "${STATUS}" = "completed" ]; then
          echo "Build check-run '${CHECK}' concluded: ${CONCLUSION}"
          if [ "${CONCLUSION}" = "success" ]; then
            echo "Image: ${IMAGE_REF}"
            echo -n "success" > $(results.build-status.path)

            # The tag can trail the check-run by seconds, so retry rather than trust the first 404
            DIGEST=""
            for attempt in 1 2 3 4 5 6; do
              if DIGEST=$(resolve_digest); then
                break
              fi
              DIGEST=""
              echo "Tag ${TAG} not readable yet, retry ${attempt}/6..."
              sleep 10
            done

            if [ -n "${DIGEST}" ]; then
              echo "Digest: ${DIGEST}"
              echo -n "${DIGEST}" > $(results.image-digest.path)
              echo -n "${IMAGE_REF%:*}@${DIGEST}" > $(results.image-ref-by-digest.path)
            elif [ "$(params.require-digest)" = "true" ]; then
              # Terminal block: nothing downstream catches this, and the digest is the deliverable
              echo "Build succeeded but ${IMAGE_REF} did not resolve to a digest." >&2
              echo "require-digest is true, so this is a failure: the run has no usable output." >&2
              echo "Check that the build publishes this exact tag. A multi-platform" >&2
              echo "pipeline only tags <tag>-<platform> unless build-image-index is true," >&2
              echo "in which case the plain tag never exists." >&2
              echo -n "failure" > $(results.build-status.path)
              exit 1
            else
              # Not fatal for a block that feeds another: the next block decides whether it can proceed
              echo "WARNING: build succeeded but ${IMAGE_REF} did not resolve to a digest" >&2
            fi
            exit 0
          fi
          echo "Build did not succeed (${CONCLUSION})" >&2
          # Repeated on the failure path: the most useful line in a red run belongs at the bottom too
          echo "Logs: ${BUILD_UI_URL}" >&2
          echo "Check run: ${BUILD_CHECK_URL}" >&2
          echo -n "failure" > $(results.build-status.path)
          exit 1
        fi

        if [ -z "${STATUS}" ]; then
          echo "Waiting for PaC to register the build on ${SHA:0:7}..."
        else
          echo "Build ${STATUS}..."
        fi
        sleep 30
      done

      echo "Timed out after $(params.timeout-minutes) minutes waiting for the build" >&2
      # Empty when PaC never registered a build: the CEL did not match, or the push did not land
      if [ -n "${BUILD_UI_URL}" ]; then
        echo "Logs: ${BUILD_UI_URL}" >&2
        echo "Check run: ${BUILD_CHECK_URL}" >&2
      else
        echo "PaC never registered a build matching '${CHECK}' on ${SHA}." >&2
        echo "Checks: https://github.com/${REPO}/commits/${SHA}" >&2
        echo "Branch: https://github.com/${REPO}/commits/${SHA}/checks" >&2
      fi
      echo -n "timeout" > $(results.build-status.path)
      exit 1
