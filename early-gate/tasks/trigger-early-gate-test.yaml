apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trigger-early-gate-test
spec:
  description: |
    Comments "/early-gate-tests" on the leader PR, which
    early-gate-ci-test.yaml's on-comment CEL ("^/early-gate-test", unanchored,
    so the plural still matches) picks up exactly as it would a human typing
    "/early-gate-test" - starting Block 4 (the smoke test) against the
    catalog this run just built.

    Invoked from early-gate-component-pipeline.yaml after the success verdict
    comment. The task always runs on the success path and no-ops unless both
    trigger-eg-tests and comment-posted are true. This preserves Tekton's aggregate
    Succeeded status when the optional test chain is disabled, while still avoiding
    a test of a build that did not fully succeed or post its verdict comment.
  params:
  - name: leader-pr-repo
    type: string
    description: org/repo holding the leader PR to comment on
  - name: leader-pr-number
    type: string
    description: Leader PR number to comment on
  - name: trigger-eg-tests
    type: string
    description: Whether to post the opt-in /early-gate-tests comment
  - name: comment-posted
    type: string
    description: Whether the success verdict comment was posted
  workspaces:
  - name: github-credentials
    description: Secret workspace holding a 'token' key with a GitHub API token
  steps:
  - name: post-comment
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    env:
    - name: LEADER_PR_REPO
      value: $(params.leader-pr-repo)
    - name: LEADER_PR_NUMBER
      value: $(params.leader-pr-number)
    - name: TRIGGER_EG_TESTS
      value: $(params.trigger-eg-tests)
    - name: COMMENT_POSTED
      value: $(params.comment-posted)
    - name: GITHUB_CREDENTIALS_PATH
      value: $(workspaces.github-credentials.path)
    script: |
      #!/bin/bash
      set -euo pipefail

      if [[ "${TRIGGER_EG_TESTS}" != "true" || "${COMMENT_POSTED}" != "true" ]]; then
        echo "Skipping /early-gate-tests: trigger-eg-tests=${TRIGGER_EG_TESTS}, comment-posted=${COMMENT_POSTED}"
        exit 0
      fi

      TOKEN=$(cat "${GITHUB_CREDENTIALS_PATH}/token")

      CODE=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
        -X POST \
        -H "Authorization: token ${TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        -d '{"body":"/early-gate-tests"}' \
        "https://api.github.com/repos/${LEADER_PR_REPO}/issues/${LEADER_PR_NUMBER}/comments")
      unset TOKEN

      if [ "${CODE}" = "201" ]; then
        echo "Posted /early-gate-tests on ${LEADER_PR_REPO}#${LEADER_PR_NUMBER}"
      else
        echo "ERROR: could not comment on ${LEADER_PR_REPO}#${LEADER_PR_NUMBER} (HTTP ${CODE})" >&2
        cat /tmp/response.json >&2 || true
        exit 1
      fi
