apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/distributed-workloads?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-comment: '^/build-konflux'
    pipelinesascode.tekton.dev/on-cel-expression: |-
      event == "pull_request"
      && (files.all.exists(p, ! p.matches('^\\.tekton/')) || ".tekton/odh-th-torch-cpu-py312-pull-request.yaml".pathChanged())
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
  labels:
    appstudio.openshift.io/application: rhoai-v3-6
    appstudio.openshift.io/component: odh-th-torch-cpu-py312-v3-6
    pipelines.appstudio.openshift.io/type: build
  name: odh-th-torch-cpu-py312-on-pull-request-{{pull_request_number}}
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-th-torch-cpu-py312-rhel9:on-pr-{{pull_request_number}}
  - name: dockerfile
    value: Dockerfile.konflux
  - name: path-context
    value: images/universal/training/th-torch-cpu-py312/
  - name: hermetic
    value: "true"
  - name: image-expires-after
    value: 30d
  - name: enable-slack-failure-notification
    value: "false"
  - name: rhel-subscription-activation-key
    value: rhel-subscription-activation-key-rhoai-devops-for-notebooks-rhel9-6
  - name: prefetch-input
    value: |
      [{"type": "pip", "path": "images/universal/training/th-torch-cpu-py312", "requirements_files": ["requirements.txt"], "binary": {"arch": "x86_64,aarch64,ppc64le", "os": "linux"}}]
  - name: build-args
    value: ["DOWNSTREAM=true"]
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-d160-m2xlarge/arm64
    - linux/ppc64le
  - name: rhoai-version
    value: "3.6.0"
  pipelineRef:
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ cel: pac.target_branch.matches("^rhoai-\\d+\\.\\d+(-ea\\.\\d+)?$") ? pac.target_branch : "main" }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
    resolver: git
  taskRunSpecs:
  - pipelineTaskName: prefetch-dependencies
    computeResources:
      requests:
        cpu: '3'
        memory: 8Gi
      limits:
        cpu: '3'
        memory: 8Gi
  - pipelineTaskName: build-images
    stepSpecs:
    - name: build
      computeResources:
        requests:
          memory: 4Gi
        limits:
          memory: 8Gi
    - name: prepare-sboms
      computeResources:
        requests:
          memory: 4Gi
        limits:
          memory: 8Gi
  - pipelineTaskName: fips-check
    stepSpecs:
    - name: run-fips-check
      computeResources:
        requests:
          memory: 4Gi
        limits:
          memory: 4Gi
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-th-torch-cpu-py312-v3-6
    podTemplate:
      imagePullSecrets:
      - name: redhat-appstudio-staginguser-pull-secret
  timeouts:
    pipeline: 8h
  workspaces:
  - name: git-auth
    secret:
      secretName: "{{ git_auth_secret }}"
