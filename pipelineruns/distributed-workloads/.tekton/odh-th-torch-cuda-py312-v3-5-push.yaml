
apiVersion: tekton.dev/v1
# konflux build manual retrigger - 2026-07-31 16:22:37
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/distributed-workloads?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    build.appstudio.openshift.io/build-nudge-files: "build/operator-nudging.yaml"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch == "rhoai-3.5"
      && ( files.all.exists(p, !p.matches('^\\.tekton/')) || ".tekton/odh-th-torch-cuda-py312-v3-5-push.yaml".pathChanged() )
  labels:
    appstudio.openshift.io/application: rhoai-v3-5
    appstudio.openshift.io/component: odh-th-torch-cuda-py312-v3-5
    pipelines.appstudio.openshift.io/type: build
  name: odh-th-torch-cuda-py312-v3-5-on-push
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: additional-tags
    value:
    - '{{target_branch}}-{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-th-torch-cuda-py312-rhel9:{{target_branch}}
  - name: rhoai-version
    value: "3.5.0"
  - name: dockerfile
    value: Dockerfile.konflux
  - name: path-context
    value: images/universal/training/th-torch-cuda-py312/
  - name: hermetic
    value: "true"
  - name: prefetch-input
    value: |
      [{"type": "pip", "path": "images/universal/training/th-torch-cuda-py312", "requirements_files": ["requirements.txt"], "binary": {"arch": "x86_64,aarch64", "os": "linux"}}]
  - name: build-args
    value: ["DOWNSTREAM=true"]
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-m4xlarge/arm64
  pipelineRef:
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ target_branch }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
    resolver: git
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-th-torch-cuda-py312-v3-5
    podTemplate:
      imagePullSecrets:
      - name: redhat-appstudio-staginguser-pull-secret
  timeouts:
    pipeline: 2h
