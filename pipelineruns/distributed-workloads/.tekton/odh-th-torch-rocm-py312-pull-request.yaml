
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/distributed-workloads?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-event: '[pull_request]'
    pipelinesascode.tekton.dev/on-comment: '^/build-konflux'
    pipelinesascode.tekton.dev/on-target-branch: '[{{target_branch}}]'
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request"
      && target_branch == "rhoai-3.6"
      && ( "images/universal/training/th-torch-rocm-py312/**".pathChanged()
      || ".tekton/odh-th-torch-rocm-py312-pull-request.yaml".pathChanged() )
  labels:
    appstudio.openshift.io/application: automation
    appstudio.openshift.io/component: odh-th-torch-rocm-py312
    pipelines.appstudio.openshift.io/type: build
  name: odh-th-torch-rocm-py312-on-pull-request-{{pull_request_number}}
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:odh-th-torch-rocm-py312-{{revision}}
  - name: dockerfile
    value: Dockerfile.konflux
  - name: path-context
    value: images/universal/training/th-torch-rocm-py312/
  - name: hermetic
    value: "true"
  - name: image-expires-after
    value: 5d
  - name: enable-slack-failure-notification
    value: "false"
  - name: rhel-subscription-activation-key
    value: rhel-subscription-activation-key-rhoai-devops-for-notebooks-rhel9-6
  - name: prefetch-input
    value: |
      [{"type": "pip", "path": "images/universal/training/th-torch-rocm-py312", "requirements_files": ["requirements.txt"], "binary": {"arch": "x86_64", "os": "linux"}}]
  - name: build-args
    value: ["DOWNSTREAM=true"]
  - name: build-platforms
    value:
    - linux/x86_64
  pipelineRef:
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ target_branch }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
    resolver: git
  taskRunSpecs:
  - pipelineTaskName: build-images
    stepSpecs:
    - name: build
      computeResources:
        requests:
          memory: 4Gi
        limits:
          memory: 8Gi
    - name: prepare-sboms
      computeResources:
        requests:
          memory: 4Gi
        limits:
          memory: 8Gi
  - pipelineTaskName: fips-check
    stepSpecs:
      - name: run-fips-check
        computeResources:
          requests:
            memory: 4Gi
          limits:
            memory: 4Gi
  taskRunTemplate:
    serviceAccountName: build-pipeline-pull-request-pipelines
    podTemplate:
      imagePullSecrets:
      - name: redhat-appstudio-staginguser-pull-secret
  timeouts:
    pipeline: 8h
