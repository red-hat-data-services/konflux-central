
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/distributed-workloads?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: '{{ cel: headers["X-Github-Event"] == "push" ? false : true }}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    build.appstudio.openshift.io/build-nudge-files: '{{ cel: headers["X-Github-Event"] == "push" ? "build/operator-nudging.yaml" : "" }}'
    pipelinesascode.tekton.dev/on-comment: '^/build-konflux'
    pipelinesascode.tekton.dev/on-cel-expression: |
      (
        event == "push"
        && target_branch == "rhoai-3.6-ea.2"
        && ( files.all.exists(p, !p.matches('^\\.tekton/')) || ".tekton/odh-th-torch-rocm-py312-v3-6-ea-2-push.yaml".pathChanged() )
      )
      ||
      (
        event == "pull_request"
        && target_branch == "rhoai-3.6-ea.2"
      )
  labels:
    appstudio.openshift.io/application: rhoai-v3-6-ea-2
    appstudio.openshift.io/component: odh-th-torch-rocm-py312-v3-6-ea-2
    pipelines.appstudio.openshift.io/type: build
  name: odh-th-torch-rocm-py312-v3-6-ea-2-on-push
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: additional-tags
    value:
    - '{{target_branch}}-{{revision}}'
  - name: output-image
    value: 'quay.io/rhoai/odh-th-torch-rocm-py312-rhel9:{{ cel: headers["X-Github-Event"] == "push" ? pac.target_branch : "pr-" + pac.pull_request_number + "-" + pac.revision }}'
  - name: image-expires-after
    value: '{{ cel: headers["X-Github-Event"] == "push" ? "" : "5d" }}'
  - name: disable-slack-notifications
    value: '{{ cel: headers["X-Github-Event"] == "push" ? false : true }}'
  - name: rhoai-version
    value: "3.6.0-ea.2"
  - name: dockerfile
    value: Dockerfile.konflux
  - name: path-context
    value: images/universal/training/th-torch-rocm-py312/
  - name: hermetic
    value: "true"
  - name: prefetch-input
    value: |
      [{"type": "pip", "path": "images/universal/training/th-torch-rocm-py312", "requirements_files": ["requirements.txt"], "binary": {"arch": "x86_64", "os": "linux"}}]
  - name: build-args
    value: ["DOWNSTREAM=true"]
  - name: build-platforms
    value:
    - linux/x86_64
  pipelineRef:
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ target_branch }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
    resolver: git
  taskRunSpecs:
  - pipelineTaskName: build-images
    stepSpecs:
    - name: build
      computeResources:
        requests:
          memory: 4Gi
        limits:
          memory: 8Gi
    - name: prepare-sboms
      computeResources:
        requests:
          memory: 4Gi
        limits:
          memory: 8Gi
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-th-torch-rocm-py312-v3-6-ea-2
    podTemplate:
      imagePullSecrets:
      - name: redhat-appstudio-staginguser-pull-secret
  timeouts:
    pipeline: 10h
    tasks: 8h
