apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: odh-training-rocm64-torch28-py312-on-pull-request-{{pull_request_number}}
  namespace: rhoai-tenant
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/distributed-workloads?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/on-event: '[pull_request]'
    pipelinesascode.tekton.dev/on-target-branch: '[{{target_branch}}]'
    pipelinesascode.tekton.dev/on-comment: '^/build-konflux'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
  labels:
    appstudio.openshift.io/application: automation
    appstudio.openshift.io/component: pull-request-pipelines-odh-training-rocm64-torch28-py312
    pipelines.appstudio.openshift.io/type: build
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:odh-training-rocm64-torch28-py312-rhel9-{{revision}}
  - name: rhoai-version
    value: "3.5.1"
  - name: dockerfile
    value: Dockerfile.konflux
  - name: path-context
    value: images/runtime/training/py312-rocm64-torch280
  - name: hermetic
    value: "false"
  - name: image-expires-after
    value: 5d
  - name: build-platforms
    value:
    - linux-extra-fast/amd64
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ target_branch }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunSpecs:
  - pipelineTaskName: build-images
    computeResources:
      requests:
        cpu: '8'
        memory: 16Gi
      limits:
        cpu: '16'
        memory: 32Gi
  taskRunTemplate:
    serviceAccountName: build-pipeline-pull-request-pipelines
  timeouts:
    pipeline: 10h
    tasks: 8h
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
