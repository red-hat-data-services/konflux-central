
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/eval-hub-contrib?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    build.appstudio.openshift.io/build-nudge-files: "build/operator-nudging.yaml"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch == "rhoai-3.7-ea.1"
      && ( files.all.exists(p, !p.matches('^\\.tekton/')) || ".tekton/odh-eval-hub-lighteval-v3-7-ea-1-push.yaml".pathChanged() )
  labels:
    appstudio.openshift.io/application: rhoai-v3-7-ea-1
    appstudio.openshift.io/component: odh-eval-hub-lighteval-v3-7-ea-1
    pipelines.appstudio.openshift.io/type: build
  name: odh-eval-hub-lighteval-v3-7-ea-1-on-push
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: additional-tags
    value:
    - '{{target_branch}}-{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-eval-hub-lighteval-rhel9:{{target_branch}}
  - name: rhoai-version
    value: "3.7.0-ea.1"
  - name: dockerfile
    value: Dockerfile.konflux
  - name: path-context
    value: adapters/lighteval
  - name: hermetic
    value: true
  - name: prefetch-input
    value: |
      [
      {
        "type": "pip",
        "path": "adapters/lighteval",
        "requirements_files": ["requirements-rhoai.txt"],
        "binary": {
          "arch": "x86_64,aarch64,ppc64le,s390x"
        }
      }
      ]

  - name: build-platforms
    value:
    - linux/x86_64
    - linux-m2xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  pipelineRef:
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ target_branch }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
    resolver: git
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-eval-hub-lighteval-v3-7-ea-1
    podTemplate:
      imagePullSecrets:
      - name: redhat-appstudio-staginguser-pull-secret
  timeouts:
    pipeline: 6h
    tasks: 4h
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
