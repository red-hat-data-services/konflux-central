apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/guardrails-detectors?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-comment: "^/build-konflux guardrails-detector-hf-runtime"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/on-cel-expression: |-
      event == "pull_request"
      && (files.all.exists(p, ! p.matches('^\\.tekton/')) || ".tekton/odh-guardrails-detector-huggingface-runtime-pull-request.yaml".pathChanged())
  labels:
    appstudio.openshift.io/application: rhoai-v3-6
    appstudio.openshift.io/component: odh-guardrails-detector-huggingface-runtime-v3-6
    pipelines.appstudio.openshift.io/type: build
  name: odh-guardrails-detector-hf-runtime-on-pull-request-71493
  namespace: rhoai-tenant
spec:
  timeouts:
    pipeline: 8h
    tasks: 4h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: additional-labels
    value:
    - version=on-pr-{{revision}}
    - io.openshift.tags=odh-guardrails-detector-huggingface-runtime
  - name: output-image
    value: quay.io/rhoai/odh-guardrails-detector-huggingface-runtime-rhel9:on-pr-{{pull_request_number}}
  - name: dockerfile
    value: Dockerfile.konflux.hf
  - name: path-context
    value: detectors
  - name: build-args-file
    value: .konflux/base-images.conf
  - name: hermetic
    value: true
  - name: allow-cross-platform-images
    value: "true"
  - name: prefetch-input
    value: |
      [
      {
        "type": "pip",
        "path": "detectors/requirements-hf/cuda",
        "requirements_files": ["requirements.txt"],
        "binary":{
          "arch": "x86_64,aarch64"
        }
      },
      {
        "type": "pip",
        "path": "detectors/requirements-hf/cpu",
        "requirements_files": ["requirements.txt"],
        "binary":{
          "arch": "ppc64le,s390x"
        }
      }
      ]
  - name: build-source-image
    value: true
  - name: build-image-index
    value: true
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/ppc64le
    - linux-m2xlarge/arm64
    - linux/s390x
  - name: image-expires-after
    value: 30d
  - name: enable-slack-failure-notification
    value: "false"
  - name: rhoai-version
    value: "3.6.0"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ cel: pac.target_branch.matches("^rhoai-\\d+\\.\\d+(-ea\\.\\d+)?$") ? pac.target_branch : "main" }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-guardrails-detector-huggingface-runtime-v3-6
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
