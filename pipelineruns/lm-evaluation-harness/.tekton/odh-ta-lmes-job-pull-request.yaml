apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/lm-evaluation-harness?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-comment: "^/build-konflux"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/on-cel-expression: |-
      event == "pull_request"
      && (files.all.exists(p, ! p.matches('^\\.tekton/')) || ".tekton/odh-ta-lmes-job-pull-request.yaml".pathChanged())
  labels:
    appstudio.openshift.io/application: rhoai-v3-6
    appstudio.openshift.io/component: odh-ta-lmes-job-v3-6
    pipelines.appstudio.openshift.io/type: build
  name: odh-ta-lmes-job-on-pull-request-57892
  namespace: rhoai-tenant
spec:
  timeouts:
    pipeline: "4h0m0s"
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: additional-labels
    value:
    - version=on-pr-{{revision}}
    - io.openshift.tags=odh-ta-lmes-job
  - name: output-image
    value: quay.io/rhoai/odh-ta-lmes-job-rhel9:on-pr-{{pull_request_number}}
  - name: dockerfile
    value: Dockerfile.konflux.lmes-job
  - name: path-context
    value: .
  - name: build-args-file
    value: .konflux/base-images.conf
  - name: hermetic
    value: "true"
  - name: prefetch-input
    value: |
      [
        {"type": "pip", "path": "requirements/cuda", "requirements_files": ["requirements.txt", "requirements-build.txt"], "binary": {"arch": "x86_64,aarch64"}},
        {"type": "pip", "path": "requirements/cpu", "requirements_files": ["requirements.txt", "requirements-build.txt"], "binary": {"arch": "ppc64le,s390x"}},
        {"type": "rpm", "path": "requirements"}
      ]
  - name: build-image-index
    value: true
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-m2xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  - name: image-expires-after
    value: 30d
  - name: allow-cross-platform-images
    value: "true"
  - name: enable-package-registry-proxy
    value: "true"
  - name: enable-slack-failure-notification
    value: "false"
  - name: rhoai-version
    value: "3.6.0"
  - name: build-source-image
    value: true
  taskRunSpecs:
  - pipelineTaskName: ecosystem-cert-preflight-checks
    computeResources:
      requests:
        cpu: '2'
        memory: 10Gi
      limits:
        cpu: '4'
        memory: 20Gi
  - pipelineTaskName: clair-scan
    computeResources:
      requests:
        cpu: '2'
        memory: 10Gi
      limits:
        cpu: '4'
        memory: 20Gi
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ cel: pac.target_branch.matches("^rhoai-\\d+\\.\\d+(-ea\\.\\d+)?$") ? pac.target_branch : "main" }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-ta-lmes-job-v3-6
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
