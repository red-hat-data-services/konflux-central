apiVersion: tekton.dev/v1
kind: PipelineRun
# konflux build manual retrigger - 2026-08-25 14:35:27
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/lm-evaluation-harness?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    build.appstudio.openshift.io/build-nudge-files: "build/operator-nudging.yaml"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch == "rhoai-3.6-ea.1"
      && ( files.all.exists(p, !p.matches('^\\.tekton/')) || ".tekton/odh-ta-lmes-job-v3-6-ea-1-push.yaml".pathChanged() )
  labels:
    appstudio.openshift.io/application: rhoai-v3-6-ea-1
    appstudio.openshift.io/component: odh-ta-lmes-job-v3-6-ea-1
    pipelines.appstudio.openshift.io/type: build
  name: odh-ta-lmes-job-v3-6-ea-1-on-push
  namespace: rhoai-tenant
spec:
  timeouts:
    pipeline: 8h
    tasks: 4h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: additional-tags
    value:
    - '{{target_branch}}-{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-ta-lmes-job-rhel9:{{target_branch}}
  - name: rhoai-version
    value: "3.6.0-ea.1"
  - name: dockerfile
    value: Dockerfile.konflux.lmes-job
  - name: path-context
    value: .
  - name: build-args-file
    value: .konflux/base-images.conf
  - name: hermetic
    value: "true"
  - name: prefetch-input
    value: |
      [
        {"type": "pip", "path": "requirements/cuda", "requirements_files": ["requirements.txt", "requirements-build.txt"], "binary": {"arch": "x86_64,aarch64"}},
        {"type": "pip", "path": "requirements/cpu", "requirements_files": ["requirements.txt", "requirements-build.txt"], "binary": {"arch": "ppc64le,s390x"}},
        {"type": "rpm", "path": "requirements"}
      ]
  - name: build-source-image
    value: true
  - name: build-image-index
    value: true
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-m2xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  - name: allow-cross-platform-images
    value: "true"
  - name: enable-package-registry-proxy
    value: "true"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ target_branch }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-ta-lmes-job-v3-6-ea-1
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
