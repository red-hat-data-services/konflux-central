
apiVersion: tekton.dev/v1
# konflux build manual retrigger - 2026-08-12 17:56:09
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/odh-dashboard?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: '{{ cel: pac.event_type == "push" ? "false" : "true" }}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    build.appstudio.openshift.io/build-nudge-files: '{{ cel: pac.event_type == "push" ? "build/operator-nudging.yaml" : "" }}'
    pipelinesascode.tekton.dev/on-comment: '^/build-konflux'
    pipelinesascode.tekton.dev/on-cel-expression: |
      (
        event == "push"
        && target_branch == "rhoai-3.6-ea.2"
        && ( files.all.exists(p, !p.matches('^\\.tekton/')) || ".tekton/odh-core-bff-v3-6-ea-2-push.yaml".pathChanged() )
      )
      ||
      (
        event == "pull_request"
        && target_branch == "rhoai-3.6-ea.2"
      )
  labels:
    appstudio.openshift.io/application: rhoai-v3-6-ea-2
    appstudio.openshift.io/component: odh-core-bff-v3-6-ea-2
    pipelines.appstudio.openshift.io/type: build
  name: odh-core-bff-v3-6-ea-2-on-push
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: additional-tags
    value:
    - '{{target_branch}}-{{revision}}'
  - name: output-image
    value: 'quay.io/rhoai/odh-core-bff-rhel9:{{ cel: pac.event_type == "push" ? pac.target_branch : "pr-" + pac.pull_request_number + "-" + pac.revision }}'
  - name: image-expires-after
    value: '{{ cel: pac.event_type == "push" ? "" : "5d" }}'
  - name: disable-slack-notifications
    value: '{{ cel: pac.event_type == "push" ? "false" : "true" }}'
  - name: rhoai-version
    value: "3.6.0-ea.2"
  - name: dockerfile
    value: Dockerfile.konflux.core-bff
  - name: path-context
    value: .
  - name: hermetic
    value: true
  - name: prefetch-input
    value: '[{"path":".","type":"npm"},{"path":"distributions/core-bff/frontend","type":"npm"},{"path":"distributions/core-bff/bff","type":"gomod"}]'
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-m2xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  pipelineRef:
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ target_branch }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
    resolver: git
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-core-bff-v3-6-ea-2
    podTemplate:
      imagePullSecrets:
      - name: redhat-appstudio-staginguser-pull-secret
  timeouts:
    pipeline: 2h
#restart
