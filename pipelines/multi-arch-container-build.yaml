apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: multi-arch-container-build
spec:
  description: |
    This pipeline is ideal for building multi-arch container images from a Containerfile while maintaining trust after pipeline customization.

    _Uses `buildah` to create a multi-platform container image leveraging [trusted artifacts](https://konflux-ci.dev/architecture/ADR/0036-trusted-artifacts.html). It also optionally creates a source image and runs some build-time tests. This pipeline requires that the [multi platform controller](https://github.com/konflux-ci/multi-platform-controller) is deployed and configured on your Konflux instance. Information is shared between tasks using OCI artifacts instead of PVCs. EC will pass the [`trusted_task.trusted`](https://conforma.dev/docs/policy/packages/release_trusted_task.html#trusted_task__trusted) policy as long as all data used to build the artifact is generated from trusted tasks.
    This pipeline is pushed as a Tekton bundle to [quay.io](https://quay.io/repository/konflux-ci/tekton-catalog/pipeline-docker-build-multi-platform-oci-ta?tab=tags)_
  params:
  - description: Source Repository URL
    name: git-url
    type: string
  - default: ""
    description: Revision of the Source Repository
    name: revision
    type: string
  - description: Fully Qualified Output Image
    name: output-image
    type: string
  - default: .
    description: Path to the source code of an application's component from where to build image.
    name: path-context
    type: string
  - default: Dockerfile
    description: Path to the Dockerfile inside the context specified by parameter path-context
    name: dockerfile
    type: string
  - default: "true"
    description: Execute the build with network isolation
    name: hermetic
    type: string
  - default: ""
    description: Build dependencies to be prefetched by Cachi2
    name: prefetch-input
    type: string
  - name: prefetch-log-level
    default: "info"
    type: string
    description: Set cachi2 log level (debug, info, warning, error)
  - name: prefetch-config-file-content
    default: ""
    type: string
    description: Pass configuration to cachi2. Note this needs to be passed as a YAML-formatted config dump, not as a file path!
  - name: prefetch-mode
    default: "strict"
    type: string
    description: Cachi2 prefetch mode. Use "permissive" for source builds that need to regenerate lockfiles (e.g. Cargo.lock). Default "strict" preserves existing behavior.
  - default: ""
    description: Image tag expiration time, time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
    name: image-expires-after
  - default: "true"
    description: Build a source image.
    name: build-source-image
    type: string
  - default: "true"
    description: Add built image into an OCI image index
    name: build-image-index
    type: string
  - default: []
    description: Array of --build-arg values ("arg=value" strings) for buildah
    name: build-args
    type: array
  - default: ""
    description: Path to a file with build arguments for buildah, see https://www.mankier.com/1/buildah-build#--build-arg-file
    name: build-args-file
    type: string
  - default: "false"
    description: Whether to enable privileged mode, should be used only with remote VMs
    name: privileged-nested
    type: string
  - default: "does-not-exist"
    description: Kubernetes secret to mount into build, see https://www.redhat.com/en/blog/sensitive-data-containers
    name: additional-build-secret
    type: string
  - default: "synk-secret"
    description: Synk Token Secret Name
    name: synk-secret
  - name: build-platforms
    default:
    - linux-extra-fast/amd64
    description: List of platforms to build the container images on. The available set of values is determined by the configuration of the multi-platform-controller.
  - description: Additional labels to add to build image
    name: additional-labels
    type: array
    default: []
  - description: Additional tags to push for build image
    name: additional-tags
    type: array
    default: []
  - description: Fetch all tags for the repo
    name: fetch-git-tags
    type: string
    default: "false"
  - description: Perform a shallow clone, fetching only the most recent N commits
    name: clone-depth
    type: string
    default: "1"
  - name: expected-cluster
    default: ""
    type: string
    description: The cluster that this pipeline is expected to be run from
  - name: buildah-format
    default: docker
    type: string
    description: The format for the resulting image's mediaType. Valid values are oci or docker.
  - name: enable-cache-proxy
    default: 'true'
    description: Enable cache proxy configuration
    type: string
  - default: ''
    description: RHOAI version of the form X.Y.Z (e.g., 3.2.1)
    name: rhoai-version
    type: string
  - name: rhel-subscription-activation-key
    default: 'custom-activation-key'
    type: string
    description: The name of the Kubernetes secret containing org and activationkey for RHEL subscription (used by prefetch-dependencies and buildah for hermetic RPM fetch and builds). See https://konflux-ci.dev/docs/building/activation-keys-subscription/
  - default: 'false'
    description: Disable all slack notifications
    name: disable-slack-notifications
    type: string
  - name: fips-check-blocking
    default: "true"
    type: string
    description: When true, a FIPS check-payload failure will fail the pipeline
  - name: sast-target-dirs
    type: string
    default: .
    description: Target directories to scan with SAST tools. Multiple values should be separated with commas.
  - name: enable-package-registry-proxy
    default: 'true'
    description: Use the package registry proxy when prefetching dependencies
    type: string
  - name: allow-cross-platform-images
    default: "false"
    description: Allow cross-platform image usage in FROM instructions (e.g. using x86_64 base images in multi-arch builds). May create incompatible images.
    type: string
  - name: source-date-epoch
    type: string
    default: ''
    description: Sets the image created time and the SOURCE_DATE_EPOCH build argument. On its own, it does not change file timestamps inside the layers (set rewrite-timestamp to "true" for that). Leave empty to keep the actual build time.
  - name: rewrite-timestamp
    type: string
    default: 'false'
    description: When "true", clamp file modification times in the image layers to at most source-date-epoch. Does nothing unless source-date-epoch is set.
  - name: omit-history
    type: string
    default: 'false'
    description: When "true", omit the build history (history timestamps, layer metadata, etc.) from the resulting image.
  results:
  - description: ""
    name: IMAGE_URL
    value: $(tasks.build-image-index.results.IMAGE_URL)
  - description: ""
    name: IMAGE_DIGEST
    value: $(tasks.build-image-index.results.IMAGE_DIGEST)
  - description: ""
    name: CHAINS-GIT_URL
    value: $(tasks.clone-repository.results.url)
  - description: ""
    name: CHAINS-GIT_COMMIT
    value: $(tasks.clone-repository.results.commit)
  tasks:
  - name: rhoai-init
    params:
    - name: expected-cluster
      value: $(params.expected-cluster)
    - name: rhoai-version
      value: $(params.rhoai-version)
    - name: image-output
      value: $(params.output-image)
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
      - name: revision
        value: 2451a456f3bbf4b5157ce5599e9e207d00cb843e
      - name: pathInRepo
        value: konflux-tekton-tasks/rhoai-init/0.1/rhoai-init.yaml
  - name: init
    params:
    - name: image-url
      value: $(params.output-image)
    taskRef:
      params:
      - name: name
        value: init
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:7854d7babe4136e53e337f6433d952532314433b48bb62b422ddc02700934d85
      - name: kind
        value: task
      resolver: bundles
    runAfter:
    - rhoai-init
  - name: clone-repository
    params:
    - name: url
      value: $(params.git-url)
    - name: revision
      value: $(params.revision)
    - name: ociStorage
      value: $(params.output-image).git
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    - name: fetchTags
      value: $(params.fetch-git-tags)
    - name: depth
      value: $(params.clone-depth)
    runAfter:
    - init
    taskRef:
      params:
      - name: name
        value: git-clone-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:a3678910c2bf9187a66a96066193cb41046fbb7097160bf2be6a374ed5e49d30
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: basic-auth
      workspace: git-auth
  - name: prefetch-dependencies
    params:
    - name: input
      value: $(params.prefetch-input)
    - name: ACTIVATION_KEY
      value: $(params.rhel-subscription-activation-key)
    - name: SOURCE_ARTIFACT
      value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
    - name: ociStorage
      value: $(params.output-image).prefetch
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    - name: log-level
      value: $(params.prefetch-log-level)
    - name: config-file-content
      value: $(params.prefetch-config-file-content)
    - name: mode
      value: $(params.prefetch-mode)
    - name: enable-package-registry-proxy
      value: $(params.enable-package-registry-proxy)
    runAfter:
    - clone-repository
    taskRef:
      params:
      - name: name
        value: prefetch-dependencies-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.10.3@sha256:0c386f2c26b46b978280c5c54caac26bcd524975f8f7cc06bb080ba00eae3ad4
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: git-basic-auth
      workspace: git-auth
    - name: netrc
      workspace: netrc
  - matrix:
      params:
      - name: PLATFORM
        value:
        - $(params.build-platforms)
    name: build-images
    timeout: 12h
    params:
    - name: ADDITIONAL_SECRET
      value: $(params.additional-build-secret)
    - name: IMAGE
      value: $(params.output-image)
    - name: DOCKERFILE
      value: $(params.dockerfile)
    - name: CONTEXT
      value: $(params.path-context)
    - name: HERMETIC
      value: $(params.hermetic)
    - name: PREFETCH_INPUT
      value: $(params.prefetch-input)
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.image-expires-after)
    - name: COMMIT_SHA
      value: $(tasks.clone-repository.results.commit)
    - name: BUILD_ARGS
      value:
      - $(params.build-args[*])
    - name: BUILD_ARGS_FILE
      value: $(params.build-args-file)
    - name: PRIVILEGED_NESTED
      value: $(params.privileged-nested)
    - name: ACTIVATION_KEY
      value: $(params.rhel-subscription-activation-key)
    - name: LABELS
      value:
      - $(params.additional-labels[*])
      - version=v$(params.rhoai-version)
      - url=$(params.git-url)
      - release=$(tasks.clone-repository.results.commit-timestamp)
      - git.url=$(params.git-url)
      - git.commit=$(params.revision)
      - cpe=$(tasks.rhoai-init.results.cpe-id)
      - name=$(tasks.rhoai-init.results.image-namespace)/$(tasks.rhoai-init.results.image-name)
      - io.openshift.tags=$(tasks.rhoai-init.results.image-name-without-rhel-suffix)
      - com.redhat.component=$(tasks.rhoai-init.results.image-name)
      - summary=$(tasks.rhoai-init.results.display-name)
      - description=$(tasks.rhoai-init.results.display-name)
      - io.k8s.display-name=$(tasks.rhoai-init.results.display-name)
      - io.k8s.description=$(tasks.rhoai-init.results.display-name)
      - "vendor=Red Hat, Inc."
      - "maintainer=RHOAI DevTestOps Team [openshift-ai-devtestops@redhat.com]"
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    - name: IMAGE_APPEND_PLATFORM
      value: "true"
    - name: BUILDAH_FORMAT
      value: $(params.buildah-format)
    - name: ALLOW_CROSS_PLATFORM_IMAGES
      value: $(params.allow-cross-platform-images)
    - name: SOURCE_DATE_EPOCH
      value: $(params.source-date-epoch)
    - name: REWRITE_TIMESTAMP
      value: $(params.rewrite-timestamp)
    - name: OMIT_HISTORY
      value: $(params.omit-history)
    runAfter:
    - prefetch-dependencies
    taskRef:
      params:
      - name: name
        value: buildah-remote-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-buildah-remote-oci-ta:0.12.3@sha256:88b971c800b3e71903ddad83da884d092e9beda8b51deaf980f6525e45ed043f
      - name: kind
        value: task
      resolver: bundles
  - name: build-image-index
    params:
    - name: IMAGE
      value: $(params.output-image)
    - name: ALWAYS_BUILD_INDEX
      value: $(params.build-image-index)
    - name: IMAGES
      value:
      - $(tasks.build-images.results.IMAGE_REF[*])
    - name: BUILDAH_FORMAT
      value: $(params.buildah-format)
    runAfter:
    - build-images
    taskRef:
      params:
      - name: name
        value: build-image-index
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.3.1@sha256:1e2e00be81beae3645588957a8c29645660d2614db1063cfded85509bf9124fb
      - name: kind
        value: task
      resolver: bundles
  - name: build-source-image
    params:
    - name: BINARY_IMAGE
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: BINARY_IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: source-build-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-source-build-oci-ta:0.3.2@sha256:45091b5022754d452b4de60c7d7f4c6e03626efff55f96e9af937400fe3506eb
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.build-source-image)
      operator: in
      values:
      - "true"
  - name: deprecated-base-image-check
    params:
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: deprecated-image-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-deprecated-image-check:0.5@sha256:0ccc688a77e9b7b0b8973c132a1e840844137e77f887be4a0bec8893b0776872
      - name: kind
        value: task
      resolver: bundles
  - name: clair-scan
    matrix:
      params:
      - name: image-platform
        value:
        - $(params.build-platforms)
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: clair-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-clair-scan:0.3.2@sha256:6c6f3c0983a8750e100db30750aae2655339d2b9214a2eb6207b41f2b8656f32
      - name: kind
        value: task
      resolver: bundles
  - name: ecosystem-cert-preflight-checks
    timeout: 2h
    matrix:
      params:
      - name: platform
        value:
        - $(params.build-platforms)
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: ecosystem-cert-preflight-checks
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-ecosystem-cert-preflight-checks:0.2@sha256:fa53ef450ba538addafee1211ff6ac15b55865ce652fec15ac99b554680cb642
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: "true"
      operator: in
      values:
      - "false"
  - name: sast-snyk-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    - name: TARGET_DIRS
      value: $(params.sast-target-dirs)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-snyk-check-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-snyk-check-oci-ta:0.5@sha256:17b9587eba53fabaab35061275306bfe1f99661d55e14e22f62321fa7cb5ff3e
      - name: kind
        value: task
      resolver: bundles
  - name: clamav-scan
    timeout: 2h
    matrix:
      params:
      - name: image-arch
        value:
        - $(params.build-platforms)
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: clamav-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-clamav-scan:0.3.4@sha256:3203cd3bde82d9e4d1beb5f1366942346800cff89e392c920733eb0ea78d731b
      - name: kind
        value: task
      resolver: bundles
  - name: sast-coverity-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE
      value: $(params.output-image)
    - name: DOCKERFILE
      value: $(params.dockerfile)
    - name: CONTEXT
      value: $(params.path-context)
    - name: HERMETIC
      value: $(params.hermetic)
    - name: PREFETCH_INPUT
      value: $(params.prefetch-input)
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.image-expires-after)
    - name: COMMIT_SHA
      value: $(tasks.clone-repository.results.commit)
    - name: BUILD_ARGS
      value:
      - $(params.build-args[*])
    - name: BUILD_ARGS_FILE
      value: $(params.build-args-file)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    - name: TARGET_DIRS
      value: $(params.sast-target-dirs)
    runAfter:
    - coverity-availability-check
    taskRef:
      params:
      - name: name
        value: sast-coverity-check-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-coverity-check-oci-ta:0.3@sha256:e92d00ed858233d0096627861192d3e4fc013cf1559c0d0b0ea0657d3377ce75
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: "true"
      operator: in
      values:
      - "false"
    - input: $(tasks.coverity-availability-check.results.STATUS)
      operator: in
      values:
      - success
  - name: coverity-availability-check
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: coverity-availability-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-coverity-availability-check:0.2@sha256:8b501440a960aec446db2ebc6625a49d0317a9fc7bf0f7bd9b18cb63052db7de
      - name: kind
        value: task
      resolver: bundles
  - name: sast-shell-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    - name: TARGET_DIRS
      value: $(params.sast-target-dirs)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-shell-check-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-shell-check-oci-ta:0.1@sha256:d00c884c78489a52dc638e6ced0a01429670d0754f5b1305ad576709cf660312
      - name: kind
        value: task
      resolver: bundles
  - name: sast-unicode-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    - name: TARGET_DIRS
      value: $(params.sast-target-dirs)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-unicode-check-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-unicode-check-oci-ta:0.4@sha256:15d654c9576b9c4ee1f78b09fce541acf9afe33f1c2363fd6219a79dbf62c95d
      - name: kind
        value: task
      resolver: bundles
  - name: apply-tags
    params:
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: ADDITIONAL_TAGS
      value:
      - $(params.additional-tags[*])
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: apply-tags
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-apply-tags:0.3.1@sha256:c177fc2b2482b1299e713c51bf258eba4972c016ef260d9f45335c2550dc7b2b
      - name: kind
        value: task
      resolver: bundles
  - name: push-dockerfile
    params:
    - name: IMAGE
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: DOCKERFILE
      value: $(params.dockerfile)
    - name: CONTEXT
      value: $(params.path-context)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: push-dockerfile-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-push-dockerfile-oci-ta:0.3.1@sha256:4c567d11296850230fe32e76d129834d3bf337a0cae9989b64279b7cfaa4e735
      - name: kind
        value: task
      resolver: bundles
  - name: rpms-signature-scan
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: rpms-signature-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-rpms-signature-scan:0.2.2@sha256:4b1856e41d087e53af26562fb16a490579777d9ff05af33011ce212d477c7cd5
      - name: kind
        value: task
      resolver: bundles
  - name: fips-check
    matrix:
      params:
      - name: image-platform
        value:
        - $(params.build-platforms)
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: blocking
      value: $(params.fips-check-blocking)
    runAfter:
    - build-image-index
    taskSpec:
      params:
      - name: image-platform
        type: string
      - name: image-url
        type: string
      - name: image-digest
        type: string
      - name: blocking
        type: string
        default: "true"
      steps:
      - name: prepare-image-list
        image: quay.io/rhoai-devops/base-runner:latest
        env:
        - name: IMAGE_PLATFORM
          value: $(params.image-platform)
        - name: IMAGE_URL
          value: $(params.image-url)
        - name: IMAGE_DIGEST
          value: $(params.image-digest)
        script: |
          ARCH="${IMAGE_PLATFORM#*/}"
          if [ "${ARCH}" = "x86_64" ]; then ARCH="amd64"; fi
          case "${ARCH}" in
            amd64|ppc64le|arm64|s390x) ;;
            *) ARCH="amd64" ;;
          esac
          IMAGE_WITHOUT_TAG=$(echo "${IMAGE_URL}" | sed 's/\(.*\):.*/\1/')
          PLATFORM_DIGEST=$(skopeo inspect --raw "docker://${IMAGE_WITHOUT_TAG}@${IMAGE_DIGEST}" | jq -r ".manifests[] | select(.platform.architecture == \"${ARCH}\") | .digest")
          if [ -z "${PLATFORM_DIGEST}" ]; then
            echo "Could not find digest for architecture ${ARCH} in ${IMAGE_URL}@${IMAGE_DIGEST}"
            exit 1
          fi
          printf '%s' "${IMAGE_WITHOUT_TAG}@${PLATFORM_DIGEST}" > /tekton/home/unique_related_images.txt
      - name: run-fips-check
        computeResources:
          requests:
            cpu: '4'
            memory: 8Gi
          limits:
            cpu: '4'
            memory: 8Gi
        ref:
          resolver: git
          params:
          - name: url
            value: https://github.com/konflux-ci/konflux-operator-tasks.git
          - name: revision
            value: c0705183d4fa1df643ba6c306c66e6f2c0276e40
          - name: pathInRepo
            value: stepactions/fips-operator-check-step-action/0.1/fips-operator-check-step-action.yaml
      - name: evaluate-result
        image: quay.io/rhoai-konflux/alpine:latest
        env:
        - name: TEST_OUTPUT
          value: $(steps.run-fips-check.results.TEST_OUTPUT)
        - name: BLOCKING
          value: $(params.blocking)
        script: |
          echo "${TEST_OUTPUT}"
          if echo "${TEST_OUTPUT}" | grep -qE '"result":"(FAILURE|ERROR)"'; then
            if [ "${BLOCKING}" = "true" ]; then
              echo "FIPS check failed and blocking is enabled"
              exit 1
            fi
            echo "FIPS check failed but blocking is not enabled, continuing"
          fi
  # Phase 0 of making this task a real gate.
  #
  # Konflux nudging is driven by the PipelineRun reaching "Succeeded". Every scan /
  # compliance task below records its verdict in a TEST_OUTPUT result but then exits 0
  # regardless of what it found, so a build with critical findings still nudged its
  # downstream components. This task now re-reads those verdicts in one place.
  #
  # REPORT MODE: findings are logged loudly but the task still exits 0, so nudging is
  # not blocked yet. See the "TODO: Flip to block mode" block in the script below.
  #
  # Tasks deliberately NOT consumed here:
  #   * ecosystem-cert-preflight-checks and sast-coverity-check are gated off in this
  #     pipeline by "when" expressions that never match. In Tekton, consuming a result
  #     of a skipped task makes the consumer skipped too, which would silently disable
  #     this gate - so they stay out until those tasks are enabled again.
  #   * fips-check is an inline taskSpec that declares no task results; it already
  #     evaluates its own TEST_OUTPUT in its "evaluate-result" step.
  - name: pipeline-success-indicator
    runAfter:
    - build-source-image
    - sast-shell-check
    - sast-unicode-check
    - deprecated-base-image-check
    - clair-scan
    - ecosystem-cert-preflight-checks
    - sast-snyk-check
    - clamav-scan
    - apply-tags
    - push-dockerfile
    - rpms-signature-scan
    - sast-coverity-check
    - coverity-availability-check
    - fips-check
    params:
    # Non-matrixed tasks emit a single TEST_OUTPUT string.
    - name: deprecated-base-image-check-test-output
      value: $(tasks.deprecated-base-image-check.results.TEST_OUTPUT)
    - name: rpms-signature-scan-test-output
      value: $(tasks.rpms-signature-scan.results.TEST_OUTPUT)
    - name: sast-shell-check-test-output
      value: $(tasks.sast-shell-check.results.TEST_OUTPUT)
    - name: sast-snyk-check-test-output
      value: $(tasks.sast-snyk-check.results.TEST_OUTPUT)
    - name: sast-unicode-check-test-output
      value: $(tasks.sast-unicode-check.results.TEST_OUTPUT)
    - name: coverity-availability-check-test-output
      value: $(tasks.coverity-availability-check.results.TEST_OUTPUT)
    # Matrixed tasks emit one TEST_OUTPUT per matrix combination, so their results are
    # consumed as arrays (same pattern as build-images.results.IMAGE_REF[*] above).
    - name: clair-scan-test-output
      value:
      - $(tasks.clair-scan.results.TEST_OUTPUT[*])
    - name: clamav-scan-test-output
      value:
      - $(tasks.clamav-scan.results.TEST_OUTPUT[*])
    taskSpec:
      params:
      - name: deprecated-base-image-check-test-output
        type: string
        default: ""
      - name: rpms-signature-scan-test-output
        type: string
        default: ""
      - name: sast-shell-check-test-output
        type: string
        default: ""
      - name: sast-snyk-check-test-output
        type: string
        default: ""
      - name: sast-unicode-check-test-output
        type: string
        default: ""
      - name: coverity-availability-check-test-output
        type: string
        default: ""
      - name: clair-scan-test-output
        type: array
        default: []
      - name: clamav-scan-test-output
        type: array
        default: []
      steps:
      - name: evaluate-scan-results
        image: quay.io/rhoai-konflux/alpine:latest
        env:
        - name: DEPRECATED_BASE_IMAGE_CHECK_TEST_OUTPUT
          value: $(params.deprecated-base-image-check-test-output)
        - name: RPMS_SIGNATURE_SCAN_TEST_OUTPUT
          value: $(params.rpms-signature-scan-test-output)
        - name: SAST_SHELL_CHECK_TEST_OUTPUT
          value: $(params.sast-shell-check-test-output)
        - name: SAST_SNYK_CHECK_TEST_OUTPUT
          value: $(params.sast-snyk-check-test-output)
        - name: SAST_UNICODE_CHECK_TEST_OUTPUT
          value: $(params.sast-unicode-check-test-output)
        - name: COVERITY_AVAILABILITY_CHECK_TEST_OUTPUT
          value: $(params.coverity-availability-check-test-output)
        # Array params cannot be interpolated into a string, so the matrixed results
        # are forwarded as positional arguments: <task-name> <json>... <separator>
        args:
        - clair-scan
        - $(params.clair-scan-test-output[*])
        - --end-of-task-results--
        - clamav-scan
        - $(params.clamav-scan-test-output[*])
        - --end-of-task-results--
        script: |
          #!/bin/sh
          # Evaluates the TEST_OUTPUT results produced by the Konflux scan tasks.
          #
          # TEST_OUTPUT is emitted by konflux-test's make_result_json() and is a single
          # line of compact JSON:
          #   {"result":"SUCCESS","timestamp":"...","note":"...","namespace":"default",
          #    "successes":0,"failures":0,"warnings":0}
          # "result" is one of SUCCESS, FAILURE, ERROR, WARNING, SKIPPED.
          #
          # The base image is busybox-based alpine with no jq, so the JSON is parsed
          # with sed. Parsing is best-effort by design: anything unexpected is reported
          # as UNKNOWN rather than treated as a pass or a failure.
          set -u

          RESULT_SEPARATOR="--end-of-task-results--"

          evaluated=0
          gating_violations=0
          advisory_violations=0
          unevaluated=0

          # coverity-availability-check only reports whether a Coverity licence and pull
          # token are present. sast-coverity-check is disabled in this pipeline, so its
          # availability check is informational and must never gate the build.
          is_advisory() {
            case "$1" in
              coverity-availability-check*) return 0 ;;
              *) return 1 ;;
            esac
          }

          json_string_field() {
            _k="$2"
            printf '%s' "$1" | sed -n 's/.*"'"${_k}"'"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
          }

          json_number_field() {
            _k="$2"
            printf '%s' "$1" | sed -n 's/.*"'"${_k}"'"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p'
          }

          report_unevaluated() {
            printf '  %-12s %s\n' "[UNKNOWN]" "$1"
            unevaluated=$((unevaluated + 1))
          }

          evaluate_result() {
            _task="$1"
            _json="$2"

            if [ -z "${_json}" ]; then
              report_unevaluated "${_task}: TEST_OUTPUT is empty - nothing to evaluate"
              return 0
            fi

            _result=$(json_string_field "${_json}" result)
            if [ -z "${_result}" ]; then
              report_unevaluated "${_task}: no parseable \"result\" field in TEST_OUTPUT"
              printf '               raw TEST_OUTPUT: %s\n' "${_json}"
              return 0
            fi

            _note=$(json_string_field "${_json}" note)
            _successes=$(json_number_field "${_json}" successes)
            _failures=$(json_number_field "${_json}" failures)
            _warnings=$(json_number_field "${_json}" warnings)

            case "${_result}" in
              SUCCESS|SKIPPED)
                _tag="[OK]"
                evaluated=$((evaluated + 1))
                ;;
              WARNING)
                # Warnings are surfaced but are not treated as gate violations.
                _tag="[WARNING]"
                evaluated=$((evaluated + 1))
                ;;
              FAILURE|ERROR)
                evaluated=$((evaluated + 1))
                if is_advisory "${_task}"; then
                  _tag="[ADVISORY]"
                  advisory_violations=$((advisory_violations + 1))
                else
                  _tag="[VIOLATION]"
                  gating_violations=$((gating_violations + 1))
                fi
                ;;
              *)
                report_unevaluated "${_task}: unrecognised result value \"${_result}\""
                printf '               raw TEST_OUTPUT: %s\n' "${_json}"
                return 0
                ;;
            esac

            printf '  %-12s %s: result=%s successes=%s failures=%s warnings=%s\n' \
              "${_tag}" "${_task}" "${_result}" \
              "${_successes:-n/a}" "${_failures:-n/a}" "${_warnings:-n/a}"
            if [ -n "${_note}" ]; then
              printf '               note: %s\n' "${_note}"
            fi
          }

          echo "============================================================================"
          echo " pipeline-success-indicator - scan and compliance result evaluation"
          echo " mode: REPORT ONLY (violations are logged, the task still succeeds)"
          echo "============================================================================"
          echo ""
          echo "--- Scan results ---"

          evaluate_result "deprecated-base-image-check" "${DEPRECATED_BASE_IMAGE_CHECK_TEST_OUTPUT:-}"
          evaluate_result "rpms-signature-scan" "${RPMS_SIGNATURE_SCAN_TEST_OUTPUT:-}"
          evaluate_result "sast-shell-check" "${SAST_SHELL_CHECK_TEST_OUTPUT:-}"
          evaluate_result "sast-snyk-check" "${SAST_SNYK_CHECK_TEST_OUTPUT:-}"
          evaluate_result "sast-unicode-check" "${SAST_UNICODE_CHECK_TEST_OUTPUT:-}"
          evaluate_result "coverity-availability-check" "${COVERITY_AVAILABILITY_CHECK_TEST_OUTPUT:-}"

          # Matrixed task results arrive as positional arguments, grouped per task and
          # terminated by RESULT_SEPARATOR.
          _current_task=""
          _index=0
          for _arg in "$@"; do
            if [ -z "${_current_task}" ]; then
              _current_task="${_arg}"
              _index=0
              continue
            fi
            if [ "${_arg}" = "${RESULT_SEPARATOR}" ]; then
              if [ "${_index}" -eq 0 ]; then
                report_unevaluated "${_current_task}: no TEST_OUTPUT values were provided"
              fi
              _current_task=""
              continue
            fi
            _index=$((_index + 1))
            evaluate_result "${_current_task} (matrix #${_index})" "${_arg}"
          done

          echo ""
          echo "--- Summary ---"
          printf '  results evaluated   : %s\n' "${evaluated}"
          printf '  gating violations   : %s\n' "${gating_violations}"
          printf '  advisory violations : %s\n' "${advisory_violations}"
          printf '  not evaluated       : %s\n' "${unevaluated}"
          echo ""

          if [ "${gating_violations}" -gt 0 ]; then
            echo "RESULT: ${gating_violations} gating scan violation(s) detected."
            echo "        Running in REPORT MODE, so the pipeline is NOT being failed."
            echo "        Downstream nudging will still happen for this build."
          else
            echo "RESULT: no gating scan violations detected."
          fi
          if [ "${advisory_violations}" -gt 0 ]; then
            echo "NOTE:   ${advisory_violations} advisory finding(s) reported above; these never gate the build."
          fi
          if [ "${unevaluated}" -gt 0 ]; then
            echo "NOTE:   ${unevaluated} result(s) could not be evaluated (missing or malformed TEST_OUTPUT)."
            echo "        Treated as inconclusive - they neither pass nor fail the gate."
          fi

          # --------------------------------------------------------------------------
          # TODO: Flip to block mode.
          #
          # This task currently always exits 0 so that teams have time to burn down the
          # existing scan findings. Once the findings are addressed, make this a real
          # gate by replacing the "exit 0" below with:
          #
          #   if [ "${gating_violations}" -gt 0 ]; then
          #     echo "Failing the pipeline: ${gating_violations} gating scan violation(s)."
          #     exit 1
          #   fi
          #   exit 0
          #
          # Also update the "mode: REPORT ONLY" banner above. Failing this task makes the
          # PipelineRun fail, which stops Konflux from nudging downstream components and
          # triggers the send-slack-notification finally task.
          #
          # Consider flipping in stages (for example clair-scan and rpms-signature-scan
          # first, then the sast-* tasks) by tracking per-task violation counters instead
          # of the single gating_violations counter.
          # --------------------------------------------------------------------------
          exit 0
  finally:
  - name: send-slack-notification
    params:
    - name: message
      value: "$(tasks.rhoai-init.results.slack-message-failure-text)"
    - name: secret-name
      value: rhoai-konflux-secret
    - name: key-name
      value: slack-webhook
    taskRef:
      params:
      - name: name
        value: slack-webhook-notification
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-slack-webhook-notification:0.1@sha256:02842e9c752056c47a409f69ed462cfd38cbd6b15facb796564a610b549222ea
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(tasks.pipeline-success-indicator.status)
      operator: notin
      values:
      - "Succeeded"
    - input: $(tasks.rhoai-init.results.skip-slack-message)
      operator: in
      values:
      - "false"
    - input: $(params.disable-slack-notifications)
      operator: notin
      values:
      - "true"
  workspaces:
  - name: git-auth
    optional: true
  - name: netrc
    optional: true
