# Common conventions; P02 routing for container push and chart/FBC push/scheduled.
# No parent inheritance: release-specific values remain owned by each branch.
tekton_layout: nested
publication_branches:
  - main
  - "rhoai-*"
context_paths:
  - pipelines/container-build.yaml
  - pipelines/multi-arch-container-build.yaml
  - pipelines/helm-chart-build.yaml
  - pipelines/fbc-fragment-build.yaml
selection_template: selection.json.j2
templates:
  - name: charts
    file: charts.yaml.j2
    match_fn: [is_push_pipeline_by_cel, is_scheduled_pipeline]
    pipeline_ref:
      resolver: git
      params:
        url: https://github.com/red-hat-data-services/konflux-central.git
        pathInRepo: pipelines/helm-chart-build.yaml
  - name: fbc-fragment
    file: fbc-fragment.yaml.j2
    match_fn: [is_push_pipeline_by_cel, is_scheduled_pipeline]
    pipeline_ref:
      resolver: git
      params:
        url: https://github.com/red-hat-data-services/konflux-central.git
        pathInRepo: pipelines/fbc-fragment-build.yaml
  - name: scheduled
    file: default.yaml.j2
    match_fn: is_scheduled_pipeline
  - name: pull-request
    file: default.yaml.j2
    match_fn: is_pr_pipeline
  - name: push
    file: push.yaml.j2
    match_fn:
      - is_push_pipeline_by_cel
      - is_push_pipeline
