# General PipelineRun conventions, with additional push-only P02 CEL routing.
# No parent inheritance: release-specific values remain owned by each branch.
tekton_layout: nested
publication_branches:
  - main
  - "rhoai-*"
context_paths:
  - pipelines/container-build.yaml
  - pipelines/multi-arch-container-build.yaml
selection_template: selection.json.j2
templates:
  - name: scheduled
    file: default.yaml.j2
    match_fn: is_scheduled_pipeline
  - name: pull-request
    file: default.yaml.j2
    match_fn: is_pr_pipeline
  - name: push
    file: push.yaml.j2
    match_fn:
      - is_push_pipeline_by_cel
      - is_push_pipeline
